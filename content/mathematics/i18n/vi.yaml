# Vietnamese translations for the mathematics curriculum.
#
# Keyed by entity kind then slug; the loader merges these into each row's `i18n` column and the
# API serves them whenever a request carries `X-Locale: vi`. Anything missing here falls back to
# the English in ../curriculum/*.yaml, so a partial translation degrades to readable English
# rather than to blank fields.
#
# Terminology follows the Vietnamese lower-secondary maths curriculum (chương trình Toán THCS):
# ước/bội, phân số, tỉ số, luỹ thừa, hàm số, phương trình bậc hai, tỉ số lượng giác.

subjects:
  mathematics:
    name: Toán học
    description: >-
      Số học, đại số, hình học và thống kê cho học sinh THCS. Mỗi kỹ năng đều được luyện tập
      bằng hệ thống bài tập sinh tự động không lặp lại và theo dõi bằng mô hình đo mức độ
      thành thạo.

courses:
  math-6:
    title: Toán học — Lớp 6
    summary: Thành thạo phân số, số thập phân, tỉ số và những bước đầu tiên vào đại số.
    description: >-
      Lớp 6 là năm học mà số học bắt đầu trở thành tư duy lập luận. Học sinh củng cố hệ thống
      số, thành thạo phân số và số thập phân, làm quen với tỉ số và tỉ số phần trăm, đồng thời
      viết những biểu thức và phương trình đại số đầu tiên.
  math-7:
    title: Toán học — Lớp 7
    summary: Số hữu tỉ, tư duy tỉ lệ và phương trình nhiều bước.
    description: >-
      Lớp 7 mở rộng mọi phép tính sang số hữu tỉ, xây dựng tư duy tỉ lệ và rèn kỹ năng giải
      phương trình nhiều bước một cách thành thục.
  math-8:
    title: Toán học — Lớp 8
    summary: Hàm số bậc nhất, định lí Pythagore, phép biến hình và bước đầu về số thực.
    description: >-
      Lớp 8 giới thiệu hàm số và đồ thị đường thẳng, định lí Pythagore, các phép biến hình và
      hệ thống số thực với căn bậc hai cùng số vô tỉ.
  math-9:
    title: Toán học — Lớp 9
    summary: Phương trình bậc hai, căn thức, lượng giác và nền tảng cho toán THPT.
    description: >-
      Lớp 9 hoàn thiện chương trình THCS với phương trình bậc hai và parabol, căn thức, tỉ số
      lượng giác trong tam giác vuông và các đại lượng thống kê nâng cao.

units:
  math-6-number-system:
    title: Hệ thống số
    summary: Giá trị theo hàng, ước và bội, và sự xuất hiện của số âm.
  math-6-fractions-decimals:
    title: Phân số và số thập phân
    summary: Nội dung quan trọng bậc nhất của số học THCS.
  math-6-ratios-percentages:
    title: Tỉ số, tỉ lệ và phần trăm
    summary: So sánh các đại lượng — toán học đằng sau công thức nấu ăn, bản đồ, khuyến mãi và vận tốc.
  math-6-expressions-equations:
    title: Biểu thức và phương trình
    summary: Chữ thay cho số — khởi đầu của đại số.
  math-6-geometry-data:
    title: Hình học, đo lường và thống kê
    summary: Diện tích, thể tích, toạ độ và cách hiểu một bộ số liệu.
  math-7-rational-numbers:
    title: Số hữu tỉ
    summary: Mọi phép tính, nay với cả số âm và phân số cùng lúc.
  math-7-proportions:
    title: Đại lượng tỉ lệ thuận
    summary: Ý tưởng nối liền tỉ số, phần trăm, tỉ lệ bản đồ và tốc độ thay đổi.
  math-7-algebra:
    title: Biểu thức và phương trình
    summary: Phương trình nhiều bước, và kỹ thuật đại số giúp việc giải trở nên thành thục.
  math-7-geometry:
    title: Hình học
    summary: Góc, đường tròn và phép đo trong không gian ba chiều.
  math-7-probability-statistics:
    title: Xác suất và thống kê
    summary: Khả năng xảy ra, và cách rút ra kết luận từ một mẫu số liệu.
  math-8-real-numbers:
    title: Số thực và luỹ thừa
    summary: Vượt ra ngoài phân số — căn bậc hai, số vô tỉ và những số rất lớn hoặc rất nhỏ.
  math-8-linear-functions:
    title: Hàm số bậc nhất
    summary: Đường thẳng, từ phương trình đến đồ thị và ngược lại.
  math-8-geometry:
    title: Hình học và định lí Pythagore
    summary: Tam giác vuông, phép biến hình và hình đồng dạng.
  math-8-statistics:
    title: Thống kê
    summary: Tìm mối liên hệ giữa hai đại lượng.
  math-9-algebra:
    title: Kỹ thuật đại số
    summary: Khai triển, phân tích thành nhân tử và rút gọn một cách thành thạo.
  math-9-quadratics:
    title: Hàm số và phương trình bậc hai
    summary: Parabol, và ba cách giải một phương trình bậc hai.
  math-9-trigonometry:
    title: Lượng giác
    summary: Nối liền số đo góc với độ dài cạnh trong tam giác vuông.
  math-9-measurement-statistics:
    title: Đo lường và thống kê
    summary: Hình khối ghép, và mô tả số liệu bằng tứ phân vị.

