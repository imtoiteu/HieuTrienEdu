# `blocks` is an overlay applied position by position onto the English blocks: only the prose
# fields are given here, and everything structural (block type, interactive widget config, the
# skill a practice block points at) is copied from the original. An empty `{}` leaves a block
# untouched — used for blocks that contain no prose, such as interactive widgets.
# ----------------------------------------------------------------------------------------
lessons:
  lesson-math-6-order-of-operations:
    title: Thứ tự thực hiện các phép tính
    summary: Vì sao 2 + 3 x 4 bằng 14 chứ không phải 20, và quy tắc giải quyết mọi tranh cãi kiểu đó.
    objectives:
      - Áp dụng đúng thứ tự thực hiện phép tính trong các biểu thức nhiều bước
      - Giải thích được vì sao thứ tự lại quan trọng
      - Dùng dấu ngoặc để chủ động thay đổi thứ tự
    blocks:
      - markdown: |
          Hai bạn học sinh cùng tính `2 + 3 x 4`.

          - **An** nói kết quả là 20. Bạn ấy cộng 2 với 3 được 5, rồi nhân với 4.
          - **Bình** nói kết quả là 14. Bạn ấy nhân 3 với 4 được 12, rồi cộng thêm 2.

          Không thể cả hai cùng đúng — và toán học không thể có một phép tính mang hai ý nghĩa
          khác nhau tuỳ theo người đọc. Vì vậy phải có một thứ tự được thống nhất.
      - title: Thứ tự thực hiện
        text: >-
          Ngoặc → Luỹ thừa → Nhân và chia (từ trái sang phải) → Cộng và trừ (từ trái sang phải).
      - markdown: |
          Phần cuối quan trọng hơn học sinh thường nghĩ: phép nhân và phép chia ở **cùng một
          mức**, nên ta thực hiện lần lượt từ trái sang phải. Phép cộng và phép trừ cũng vậy.
      - title: Thực hiện một phép tính đầy đủ
        steps:
          - text: Bắt đầu với biểu thức đã cho.
            math: '20 - 3 \times (2 + 4)^2 \div 9'
          - text: Thực hiện trong ngoặc trước.
            math: '20 - 3 \times 6^2 \div 9'
          - text: Tiếp theo là luỹ thừa.
            math: '20 - 3 \times 36 \div 9'
          - text: "Nhân và chia, từ trái sang phải: 3 × 36 = 108, rồi 108 ÷ 9 = 12."
            math: '20 - 12'
          - text: Cuối cùng là phép trừ.
            math: '8'
      - title: Một cái bẫy thường gặp
        text: >-
          Với 24 ÷ 4 × 2, hãy làm từ trái sang phải: 24 ÷ 4 = 6, rồi 6 × 2 = 12. Nếu nhân trước
          sẽ ra 3, và đó là kết quả sai.
      - prompt: Hãy tự làm thử vài câu — mỗi lần hệ thống sẽ sinh ra đề mới.
      - points:
          - Ngoặc, rồi luỹ thừa, rồi × và ÷ từ trái sang phải, cuối cùng + và − từ trái sang phải
          - Phép nhân không phải lúc nào cũng làm trước phép chia — hãy đọc từ trái sang phải
          - Dùng dấu ngoặc mỗi khi em muốn ép một thứ tự khác
  lesson-math-6-adding-fractions:
    title: Cộng và trừ phân số
    summary: Vì sao không thể cộng tử với tử, mẫu với mẫu, và cách làm đúng.
    objectives:
      - Giải thích được vì sao phải quy đồng mẫu số trước khi cộng phân số
      - Tìm mẫu số chung bằng bội chung nhỏ nhất
      - Cộng và trừ được các phân số khác mẫu
    blocks:
      - markdown: |
          Đây là lỗi sai phổ biến nhất trong toán THCS:

          $$\frac{1}{2} + \frac{1}{3} = \frac{2}{5} \quad \text{(sai!)}$$

          Em có thể thấy ngay là sai mà không cần biến đổi gì. Một nửa vốn đã lớn hơn hai phần
          năm — nên cộng thêm một lượng nữa không thể làm nó nhỏ đi được.
      - title: Lí do
        text: >-
          Mẫu số của một phân số cho biết mỗi phần lớn bằng bao nhiêu. Ta chỉ cộng được những
          phần có cùng kích thước. Một nửa và một phần ba có kích thước khác nhau, nên phải chia
          lại trước khi gộp được với nhau.
      - {}
      - title: Cộng một nửa với một phần ba
        steps:
          - text: Mẫu số chung nhỏ nhất của 2 và 3 là 6.
          - text: Chia lại mỗi phân số thành các phần sáu.
            math: '\frac{1}{2} = \frac{3}{6} \qquad \frac{1}{3} = \frac{2}{6}'
          - text: Bây giờ các phần đã bằng nhau, nên chỉ cần cộng các tử số.
            math: '\frac{3}{6} + \frac{2}{6} = \frac{5}{6}'
      - markdown: |
          ### Tìm mẫu số chung

          Hãy dùng **bội chung nhỏ nhất** của hai mẫu số. Em cũng có thể lấy tích của hai mẫu
          số — cách đó vẫn đúng, chỉ là sẽ phải rút gọn nhiều hơn ở bước cuối.
      - headers: [Phép tính, Các mẫu số, BCNN, Sau khi quy đồng]
        rows:
          - ["1/4 + 1/6", "4 và 6", "12", "3/12 + 2/12 = 5/12"]
          - ["2/5 + 1/3", "5 và 3", "15", "6/15 + 5/15 = 11/15"]
          - ["3/8 − 1/4", "8 và 4", "8", "3/8 − 2/8 = 1/8"]
      - title: Luôn kiểm tra lại
        text: >-
          Khi làm xong, hãy tự hỏi kết quả có rút gọn được nữa không — và nó có hợp lí không.
          Cộng hai phân số nhỏ hơn 1 thì không thể ra một số rất lớn.
      - {}
      - points:
          - Chỉ cộng được phân số khi các mẫu số bằng nhau
          - Dùng BCNN của các mẫu số làm mẫu số chung
          - Chỉ cộng các tử số — mẫu số giữ nguyên
          - Rút gọn ở bước cuối và kiểm tra xem độ lớn của kết quả có hợp lí không
  lesson-math-6-ratios:
    title: Hiểu về tỉ số
    summary: So sánh hai đại lượng — ý tưởng đằng sau công thức nấu ăn, bản đồ và pha màu sơn.
    objectives:
      - Viết được tỉ số từ một tình huống thực tế
      - Rút gọn tỉ số về dạng tối giản
      - Phân biệt tỉ số giữa hai phần với tỉ số giữa một phần và toàn thể
    blocks:
      - markdown: |
          Một lớp học có 12 bạn nam và 18 bạn nữ. Ta có thể so sánh hai số này theo nhiều cách,
          và **tỉ số** là một trong số đó.

          Ta viết tỉ số giữa số bạn nam và số bạn nữ là `12 : 18`.
      - markdown: |
          ### Rút gọn

          Cũng như phân số, một tỉ số có thể rút gọn bằng cách chia cả hai số hạng cho một ước
          chung. Ước chung lớn nhất của 12 và 18 là 6:

          $$12 : 18 = 2 : 3$$

          Điều này cho ta một thông tin hữu ích: cứ 2 bạn nam thì có 3 bạn nữ.
      - title: Tỉ số giữa hai phần khác với tỉ số so với toàn thể
        text: >-
          Tỉ số giữa số nam và số nữ là 2 : 3. Nhưng *phân số* chỉ phần học sinh nam của cả lớp
          lại là 2/5, không phải 2/3 — vì tổng cộng có 5 phần. Nhầm lẫn hai điều này là lỗi sai
          hay gặp nhất khi học về tỉ số.
      - title: Chia một lượng theo tỉ số
        steps:
          - text: "Chia 350 000 đồng cho hai bạn học sinh theo tỉ số 3 : 4."
          - text: "Tổng số phần: 3 + 4 = 7."
          - text: "Một phần: 350 000 ÷ 7 = 50 000 đồng."
          - text: "Bạn thứ nhất nhận 3 × 50 000 = 150 000 đồng."
          - text: "Bạn thứ hai nhận 4 × 50 000 = 200 000 đồng."
          - text: "Kiểm tra lại: 150 000 + 200 000 = 350 000. ✓"
      - {}
      - points:
          - Tỉ số dùng để so sánh hai đại lượng cùng loại
          - Rút gọn bằng cách chia cả hai số hạng cho ước chung lớn nhất
          - Với câu hỏi so với toàn thể, hãy cộng các phần lại trước để tìm tổng số phần
  lesson-math-7-two-step-equations:
    title: Giải phương trình hai bước
    summary: Khử hai phép toán theo đúng thứ tự để tìm ẩn số.
    objectives:
      - Giải được phương trình dạng ax + b = c
      - Giải thích được vì sao phải khử các phép toán theo thứ tự ngược lại
      - Kiểm tra nghiệm bằng cách thay lại vào phương trình
    blocks:
      - markdown: |
          Một phương trình giống như một chiếc cân. Làm gì với vế này thì phải làm đúng như vậy
          với vế kia — nếu không, hai vế sẽ không còn bằng nhau.

          Để giải `3x + 5 = 20` ta cần đưa `x` về một mình. Bí quyết là **khử các phép toán
          theo thứ tự ngược lại**.
      - title: Hãy nghĩ đến việc mặc đồ
        text: >-
          Em đi tất trước rồi mới đi giày. Khi cởi ra thì phải cởi giày trước rồi mới cởi tất —
          theo thứ tự ngược lại. Phương trình cũng vậy: phép toán được thực hiện sau cùng với x
          chính là phép toán em khử đầu tiên.
      - title: Giải phương trình 3x + 5 = 20
        steps:
          - text: Phương trình đã cho.
            math: '3x + 5 = 20'
          - text: "Phép toán cuối cùng tác động lên x là '+ 5', nên khử nó trước — trừ 5 ở cả hai vế."
            math: '3x = 15'
          - text: "Bây giờ khử phép '× 3' bằng cách chia cả hai vế cho 3."
            math: 'x = 5'
          - text: "Kiểm tra bằng cách thay lại: 3(5) + 5 = 15 + 5 = 20. ✓"
      - caption: >-
          Công thức tổng quát — nhưng hiểu và suy luận theo từng bước vẫn tốt hơn nhiều so với
          học thuộc công thức này.
      - title: Chú ý dấu
        text: >-
          Với 4x − 7 = 13, phép toán là '− 7', nên em khử nó bằng cách *cộng* 7: 4x = 20, suy ra
          x = 5.
      - {}
      - points:
          - Làm gì với vế này thì phải làm đúng như vậy với vế kia
          - Khử các phép toán theo thứ tự ngược lại — cộng/trừ trước, rồi mới nhân/chia
          - Luôn thay nghiệm trở lại phương trình để kiểm tra
  lesson-math-8-gradient:
    title: Hệ số góc của đường thẳng
    summary: Đo độ dốc bằng một con số duy nhất, và ý nghĩa của nó trong thực tế.
    objectives:
      - Tính được hệ số góc từ hai điểm
      - Hiểu ý nghĩa của hệ số góc dương, âm và bằng không
      - Giải thích được hệ số góc biểu thị điều gì trong một đồ thị thực tế
    blocks:
      - markdown: |
          **Hệ số góc** của một đường thẳng cho biết đường thẳng đó dốc đến mức nào. Nó trả lời
          câu hỏi: *cứ đi sang phải một bước thì đi lên (hoặc xuống) bao nhiêu?*

          $$m = \frac{\text{độ tăng tung độ}}{\text{độ tăng hoành độ}} = \frac{y_2 - y_1}{x_2 - x_1}$$
      - {}
      - title: Tính hệ số góc của đường thẳng qua (1, 3) và (5, 11)
        steps:
          - text: Đặt tên cho hai điểm.
            math: '(x_1, y_1) = (1, 3) \qquad (x_2, y_2) = (5, 11)'
          - text: "Độ tăng tung độ: phần thay đổi của y."
            math: '11 - 3 = 8'
          - text: "Độ tăng hoành độ: phần thay đổi của x."
            math: '5 - 1 = 4'
          - text: Hệ số góc.
            math: 'm = \frac{8}{4} = 2'
      - headers: [Hệ số góc, Đường thẳng như thế nào, Ví dụ]
        rows:
          - [Dương, Đi lên từ trái sang phải, "m = 3"]
          - [Âm, Đi xuống từ trái sang phải, "m = −2"]
          - [Bằng không, Nằm ngang, "m = 0"]
          - [Không xác định, Thẳng đứng (độ tăng hoành độ bằng 0), "x = 4"]
      - title: Hệ số góc luôn mang một ý nghĩa
        text: >-
          Trên đồ thị quãng đường — thời gian, hệ số góc chính là tốc độ. Trên đồ thị chi phí, nó
          là đơn giá mỗi sản phẩm. Hệ số góc gần như luôn là một *tốc độ thay đổi* — đó là lí do
          nó quan trọng vượt xa phạm vi hình học.
      - title: Giữ đúng thứ tự
        text: >-
          Nếu em đặt y₂ ở tử thì phải đặt x₂ ở mẫu. Đổi chỗ một cái mà không đổi cái kia sẽ làm
          hệ số góc đổi dấu.
      - {}
      - points:
          - "Hệ số góc = độ tăng tung độ ÷ độ tăng hoành độ = (y₂ − y₁) ÷ (x₂ − x₁)"
          - Dương thì đi lên, âm thì đi xuống, bằng không thì nằm ngang
          - Trong thực tế, hệ số góc biểu thị một tốc độ thay đổi
  lesson-math-8-pythagoras:
    title: Định lí Pythagore
    summary: Mối liên hệ giữa ba cạnh của mọi tam giác vuông.
    objectives:
      - Phát biểu và vận dụng được định lí Pythagore
      - Xác định đúng cạnh huyền
      - Giải được các bài toán liên quan đến tam giác vuông
    blocks:
      - markdown: |
          Trong **mọi** tam giác vuông, bình phương cạnh dài nhất bằng tổng bình phương hai cạnh
          còn lại.

          $$a^2 + b^2 = c^2$$

          Cạnh dài nhất, `c`, được gọi là **cạnh huyền**. Nó luôn là cạnh đối diện với góc vuông.
      - {}
      - title: Hãy xác định cạnh huyền trước
        text: >-
          Trước khi tính toán, hãy tìm góc vuông rồi nhìn thẳng sang cạnh đối diện nó. Cạnh đó
          chính là cạnh huyền — và nó phải là cạnh dài nhất.
      - title: Tính cạnh huyền
        steps:
          - text: Một tam giác có hai cạnh góc vuông là 6 cm và 8 cm.
          - text: Áp dụng định lí.
            math: 'c^2 = 6^2 + 8^2'
          - text: Bình phương từng cạnh.
            math: 'c^2 = 36 + 64 = 100'
          - text: Lấy căn bậc hai.
            math: 'c = \sqrt{100} = 10\text{ cm}'
      - title: Tính một cạnh góc vuông
        steps:
          - text: Một chiếc thang dài 13 m dựa vào tường, chân thang cách chân tường 5 m.
          - text: Chiếc thang chính là cạnh huyền, nên ta biến đổi định lí.
            math: 'a^2 = c^2 - b^2'
          - text: Thay số.
            math: 'a^2 = 13^2 - 5^2 = 169 - 25 = 144'
          - text: Vậy thang chạm tường ở độ cao 12 m.
            math: 'a = 12\text{ m}'
      - title: Phải trừ khi tìm cạnh góc vuông
        text: >-
          Cộng trong khi lẽ ra phải trừ là lỗi hay gặp nhất khi dùng định lí Pythagore. Nếu em
          đang tìm một cạnh góc vuông thì kết quả phải *nhỏ hơn* cạnh huyền — nếu không, chắc
          chắn em đã cộng thay vì trừ.
      - {}
      - points:
          - "a² + b² = c², trong đó c là cạnh huyền"
          - Cạnh huyền đối diện góc vuông và luôn là cạnh dài nhất
          - Khi tìm một cạnh góc vuông, phải trừ chứ không cộng
          - Định lí chỉ đúng với tam giác vuông
  lesson-math-9-factorising-quadratics:
    title: Phân tích tam thức bậc hai thành nhân tử
    summary: Làm ngược lại phép khai triển — kỹ năng then chốt để giải phương trình bậc hai.
    objectives:
      - Phân tích được biểu thức dạng x² + bx + c thành nhân tử
      - Chọn đúng cặp số một cách có hệ thống
      - Kiểm tra kết quả phân tích bằng cách khai triển lại
    blocks:
      - markdown: |
          Em đã biết cách khai triển:

          $$(x + 2)(x + 3) = x^2 + 5x + 6$$

          **Phân tích thành nhân tử** chính là quá trình đó làm theo chiều ngược lại. Cho
          `x² + 5x + 6`, ta muốn quay về `(x + 2)(x + 3)`.
      - title: Hai số cần tìm
        text: >-
          Với x² + bx + c, hãy tìm hai số có **tích bằng c** và **tổng bằng b**. Nên bắt đầu từ
          phép nhân — thường sẽ có ít lựa chọn hơn.
      - title: Phân tích x² + 7x + 12
        steps:
          - text: Ta cần hai số có tích bằng 12 và tổng bằng 7.
          - text: "Các cặp ước của 12: (1, 12), (2, 6), (3, 4)."
          - text: "Tổng của chúng: 13, 8, 7. Cặp cuối cùng thoả mãn."
          - text: "Vậy kết quả phân tích là:"
            math: 'x^2 + 7x + 12 = (x + 3)(x + 4)'
          - text: "Kiểm tra bằng cách khai triển: x² + 4x + 3x + 12 = x² + 7x + 12. ✓"
      - markdown: |
          ### Khi dấu thay đổi

          Dấu của `b` và `c` cho em biết trước dấu bên trong các ngoặc:
      - headers: [Dấu của c, Dấu của b, Dấu trong ngoặc, Ví dụ]
        rows:
          - [dương, dương, cùng dương, "x² + 7x + 12 = (x+3)(x+4)"]
          - [dương, âm, cùng âm, "x² − 7x + 12 = (x−3)(x−4)"]
          - [âm, dương hoặc âm, một dương một âm, "x² − x − 12 = (x−4)(x+3)"]
      - title: Vì sao điều này quan trọng
        text: >-
          Phân tích thành nhân tử không phải là bài tập vô ích. Khi một biểu thức đã ở dạng tích,
          ta áp dụng được **quy tắc tích bằng không**: nếu A × B = 0 thì A = 0 hoặc B = 0. Chính
          điều đó làm cho phương trình bậc hai giải được.
      - {}
      - points:
          - Tìm hai số có tích bằng c và tổng bằng b
          - Dựa vào dấu của b và c để đoán trước dấu trong các ngoặc
          - Luôn kiểm tra lại bằng cách khai triển
          - Phân tích thành nhân tử là chìa khoá để giải phương trình bậc hai
