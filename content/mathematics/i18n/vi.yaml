# ----------------------------------------------------------------------------------------
# Question templates.
#
# These are *templates*, not rendered questions: the {{ … }} placeholders are substituted with
# the sampled values at serve time, so they must be copied across exactly. The loader validates
# every translation by generating four variants from it, which is what stops a mistyped
# placeholder reaching a student.
#
# `hints` and `solution` are lists whose order matches the English; `choices` are the answer
# option labels in their original order.
# ----------------------------------------------------------------------------------------
questions:
  m6-place-value-write:
    prompt: "Viết số sau bằng chữ số: {{m}} triệu, {{t}} nghìn, {{u}} đơn vị."
    hints:
      - text: Một triệu là 1 000 000 và một nghìn là 1 000.
      - text: Hãy tính {{m}} x 1 000 000, rồi {{t}} x 1 000, sau đó cộng thêm {{u}}.
    solution:
      - text: "{{m}} triệu = {{m*1000000}}."
      - text: "{{t}} nghìn = {{t*1000}}."
      - text: Cộng cả ba phần lại ta được {{m*1000000 + t*1000 + u}}.
  m6-place-value-digit:
    prompt: "Trong số {{a}}{{b}}{{c}}{{d}}, *giá trị* của chữ số {{b}} là bao nhiêu?"
    hints:
      - text: "Đếm các hàng từ phải sang trái: hàng đơn vị, hàng chục, hàng trăm, hàng nghìn."
      - text: Chữ số {{b}} nằm ở hàng trăm.
    solution:
      - text: Đọc từ phải sang trái, chữ số {{b}} nằm ở hàng trăm.
      - text: Vậy giá trị của nó là {{b}} x 100 = {{b*100}}.
  m6-rounding-nearest:
    prompt: Làm tròn số {{n}} đến hàng {{p}} gần nhất.
    hints:
      - text: Xét chữ số đứng ngay bên phải hàng {{p}}.
      - text: Nếu chữ số đó từ 5 trở lên thì làm tròn lên, ngược lại thì làm tròn xuống.
    solution:
      - text: "{{n}} nằm giữa {{floor(n/p)*p}} và {{floor(n/p)*p + p}}."
      - text: Giá trị gần hơn trong hai số đó là {{round(n/p)*p}}.
  m6-rounding-estimate:
    prompt: >-
      Ước lượng {{a}} + {{b}} bằng cách làm tròn mỗi số đến hàng trăm gần nhất trước. Kết quả
      ước lượng của em là bao nhiêu?
    hints:
      - text: Hãy làm tròn từng số riêng rẽ trước khi cộng.
    solution:
      - text: "{{a}} làm tròn thành {{round(a/100)*100}}."
      - text: "{{b}} làm tròn thành {{round(b/100)*100}}."
      - text: Kết quả ước lượng là {{round(a/100)*100 + round(b/100)*100}}.
  m6-order-ops-basic:
    prompt: Tính {{a}} + {{b}} x {{c}}.
    hints:
      - text: Phép nhân được thực hiện trước phép cộng.
      - text: Hãy tính {{b}} x {{c}} trước.
    solution:
      - text: "Nhân trước: {{b}} x {{c}} = {{b*c}}."
      - text: "Sau đó cộng: {{a}} + {{b*c}} = {{a + b*c}}."
  m6-order-ops-brackets:
    prompt: Tính ({{a}} + {{b}}) x {{c}} - {{d}}.
    hints:
      - text: Thực hiện trong ngoặc trước, rồi đến phép nhân, cuối cùng là phép trừ.
    solution:
      - text: "Trong ngoặc: {{a}} + {{b}} = {{a+b}}."
      - text: "Nhân: {{a+b}} x {{c}} = {{(a+b)*c}}."
      - text: "Trừ: {{(a+b)*c}} - {{d}} = {{(a+b)*c - d}}."
  m6-factors-identify:
    prompt: Chọn tất cả các số là ước của {{n}}.
    hints:
      - text: Một ước chia hết cho số đó, không để lại số dư.
      - text: Hãy thử chia {{n}} cho từng đáp án.
    solution:
      - text: "{{n}} = 2 x {{k}} x {{m}}, nên 2, {{k}} và {{m}} đều chia hết {{n}}."
  m6-multiples-tf:
    prompt: "Đúng hay sai: {{n}} là bội của {{k}}."
    hints:
      - text: Một bội của {{k}} xuất hiện trong bảng nhân {{k}}.
    solution:
      - text: "{{n}} chia cho {{k}} có số dư là {{n % k}}."
  m6-prime-factorisation:
    prompt: >-
      Phân tích {{n}} thành tích các thừa số nguyên tố theo thứ tự tăng dần, dùng dấu x
      (ví dụ 2 x 2 x 3).
    hints:
      - text: Hãy bắt đầu chia cho số nguyên tố nhỏ nhất mà chia hết.
      - text: Tiếp tục chia cho đến khi mọi thừa số còn lại đều là số nguyên tố.
    solution:
      - text: "{{n}} = 2 x {{lo}} x {{hi}}, và mỗi thừa số đó đều là số nguyên tố."
  m6-gcf:
    prompt: Ước chung lớn nhất (ƯCLN) của {{a}} và {{b}} là bao nhiêu?
    hints:
      - text: Hãy liệt kê các ước của mỗi số rồi tìm ước chung lớn nhất.
      - text: Hoặc phân tích cả hai số ra thừa số nguyên tố rồi lấy phần chung.
    solution:
      - text: "{{a}} = {{g}} x {{p}} và {{b}} = {{g}} x {{q}}."
      - text: Vì {{p}} và {{q}} không có ước chung nên ƯCLN là {{gcd(a,b)}}.
  m6-lcm:
    prompt: Bội chung nhỏ nhất (BCNN) của {{a}} và {{b}} là bao nhiêu?
    hints:
      - text: Hãy liệt kê các bội của mỗi số cho đến khi gặp một số xuất hiện ở cả hai dãy.
    solution:
      - text: BCNN của {{a}} và {{b}} là {{lcm(a,b)}}.
      - text: "Kiểm tra lại: {{lcm(a,b)}} / {{a}} = {{lcm(a,b)/a}} và {{lcm(a,b)}} / {{b}} = {{lcm(a,b)/b}}."
  m6-negative-context:
    prompt: >-
      Nhiệt độ ở Sa Pa là {{t}} độ C. Qua đêm, nhiệt độ giảm {{d}} độ. Nhiệt độ mới là bao
      nhiêu độ C?
    hints:
      - text: Giảm nhiệt độ nghĩa là di chuyển sang trái trên trục số.
    solution:
      - text: Bắt đầu từ {{t}} và giảm {{d}} độ ta được {{t - d}} độ C.
    options:
      unit: độ C
  m6-compare-integers:
    prompt: "Dấu nào điền vào chỗ trống là đúng?   {{a}}  ?  {{b}}"
    hints:
      - text: Trên trục số, số nằm bên phải là số lớn hơn.
      - text: Nhớ rằng -10 nhỏ hơn -2, vì nó nằm xa hơn về bên trái.
    solution:
      - text: "{{a}} và {{b}} nằm trên trục số, số nhỏ hơn ở bên trái."
      - text: Vậy dấu đúng là dấu làm cho khẳng định trở nên đúng.
    choices:
      - "<  (bé hơn)"
      - ">  (lớn hơn)"
      - "=  (bằng)"
  m6-add-integers:
    prompt: Tính {{a}} + ({{b}}).
    hints:
      - text: Cộng với một số âm chính là trừ đi số đối của nó.
      - text: Vậy {{a}} + ({{b}}) cũng chính là {{a}} - {{abs(b)}}.
    solution:
      - text: "{{a}} + ({{b}}) = {{a}} - {{abs(b)}} = {{a + b}}."
  m6-subtract-negative:
    prompt: Tính {{a}} - ({{b}}).
    hints:
      - text: Trừ đi một số âm chính là cộng thêm số dương tương ứng.
    solution:
      - text: "{{a}} - ({{b}}) = {{a}} + {{abs(b)}} = {{a - b}}."
  m6-equivalent-fraction:
    prompt: "Điền số còn thiếu: \\frac{ {{a}} }{ {{b}} } = \\frac{ ? }{ {{b*k}} }"
    hints:
      - text: Mẫu số đã được nhân với {{k}}.
      - text: Hãy nhân tử số với cùng số đó.
    solution:
      - text: "{{b}} x {{k}} = {{b*k}}, nên tử số cũng phải nhân với {{k}}."
      - text: "{{a}} x {{k}} = {{a*k}}."
  m6-simplify-fraction:
    prompt: "Rút gọn \\frac{ {{n}} }{ {{d}} } về phân số tối giản, viết dạng ví dụ 3/4."
    hints:
      - text: Hãy tìm ước chung lớn nhất của {{n}} và {{d}}.
      - text: ƯCLN là {{g}} — hãy chia cả tử và mẫu cho số đó.
    solution:
      - text: "ƯCLN({{n}}, {{d}}) = {{g}}."
      - text: "{{n}} / {{g}} = {{p}} và {{d}} / {{g}} = {{q}}, vậy đáp án là {{p}}/{{q}}."
  m6-compare-fractions:
    prompt: "Phân số nào lớn hơn: \\frac{ {{a}} }{ {{b}} } hay \\frac{ {{c}} }{ {{d}} }?"
    hints:
      - text: Hãy quy đồng mẫu số hai phân số, hoặc nhân chéo.
    solution:
      - text: "Nhân chéo: {{a}} x {{d}} = {{a*d}} và {{c}} x {{b}} = {{c*b}}."
      - text: Phân số có tích chéo lớn hơn là phân số lớn hơn.
  m6-common-denominator:
    prompt: Mẫu số chung nhỏ nhất của {{a}}/{{b}} và {{c}}/{{d}} là bao nhiêu?
    hints:
      - text: Mẫu số chung nhỏ nhất chính là BCNN của hai mẫu số.
    solution:
      - text: "BCNN({{b}}, {{d}}) = {{lcm(b,d)}}."
  m6-add-fractions-same:
    prompt: "Tính \\frac{ {{a}} }{ {{d}} } + \\frac{ {{b}} }{ {{d}} }. Viết đáp án dạng phân số, ví dụ 3/4."
    hints:
      - text: Hai mẫu số đã bằng nhau nên chỉ cần cộng hai tử số.
    solution:
      - text: "{{a}} + {{b}} = {{a+b}}, mẫu số vẫn giữ nguyên là {{d}}."
  m6-add-fractions-unlike:
    prompt: "Tính \\frac{ {{a}} }{ {{b}} } + \\frac{ {{c}} }{ {{d}} }. Viết đáp án dạng phân số, ví dụ 5/6."
    hints:
      - text: Hãy quy đồng hai phân số về mẫu số chung {{b*d}}.
      - text: "{{a}}/{{b}} trở thành {{a*d}}/{{b*d}} và {{c}}/{{d}} trở thành {{c*b}}/{{b*d}}."
    solution:
      - text: "Mẫu số chung: {{b}} x {{d}} = {{b*d}}."
      - text: "{{a*d}}/{{b*d}} + {{c*b}}/{{b*d}} = {{a*d + c*b}}/{{b*d}}."
  m6-multiply-fractions:
    prompt: "Tính \\frac{ {{a}} }{ {{b}} } x \\frac{ {{c}} }{ {{d}} }. Viết đáp án dạng phân số tối giản."
    hints:
      - text: Nhân các tử số với nhau, rồi nhân các mẫu số với nhau.
    solution:
      - text: "{{a}} x {{c}} = {{a*c}} và {{b}} x {{d}} = {{b*d}}."
      - text: Kết quả {{a*c}}/{{b*d}} đã ở dạng tối giản.
  m6-divide-fractions:
    prompt: "Tính \\frac{ {{a}} }{ {{b}} } ÷ \\frac{ {{c}} }{ {{d}} }. Viết đáp án dạng phân số."
    hints:
      - text: Chia cho một phân số chính là nhân với phân số nghịch đảo của nó.
      - text: Đảo ngược {{c}}/{{d}} thành {{d}}/{{c}}, rồi nhân.
    solution:
      - text: "{{a}}/{{b}} ÷ {{c}}/{{d}} = {{a}}/{{b}} x {{d}}/{{c}}."
      - text: "= {{a*d}}/{{b*c}}."
  m6-mixed-number-convert:
    prompt: >-
      Đổi hỗn số {{w}} và {{n}}/{{d}} thành phân số. Tử số của phân số đó là bao nhiêu?
    hints:
      - text: Nhân phần nguyên với mẫu số, rồi cộng với tử số.
    solution:
      - text: "{{w}} x {{d}} = {{w*d}}."
      - text: "{{w*d}} + {{n}} = {{w*d + n}}, vậy phân số là {{w*d+n}}/{{d}}."
  m6-decimal-compare:
    prompt: Số nào lớn hơn?
    hints:
      - text: So sánh phần nguyên trước, rồi đến hàng phần mười, sau đó hàng phần trăm.
    solution:
      - text: So sánh lần lượt theo từng hàng sẽ cho biết số nào lớn hơn.
  m6-decimal-multiply:
    prompt: Tính {{a}} x {{b}}.
    hints:
      - text: Bỏ qua dấu phẩy thập phân, nhân như số tự nhiên rồi đặt lại dấu phẩy.
    solution:
      - text: "{{a}} x {{b}} = {{a*b : 2}}."
  m6-fraction-to-decimal:
    prompt: Viết {{a}}/{{b}} dưới dạng số thập phân.
    hints:
      - text: "Một phân số chính là một phép chia: {{a}} chia cho {{b}}."
    solution:
      - text: "{{a}} ÷ {{b}} = {{a/b}}."
  m6-ratio-simplify:
    prompt: >-
      Một lớp có {{b}} bạn nam và {{g}} bạn nữ. Hãy viết tỉ số giữa số bạn nam và số bạn nữ ở
      dạng tối giản, dùng dấu hai chấm (ví dụ 2:3).
    hints:
      - text: Chia cả hai số hạng của tỉ số cho ước chung lớn nhất của chúng.
      - text: ƯCLN của {{b}} và {{g}} là {{k}}.
    solution:
      - text: "{{b}}:{{g}} chia cho {{k}} ta được {{p}}:{{q}}."
  m6-equivalent-ratio-missing:
    prompt: >-
      Một công thức nấu ăn dùng {{a}} cốc bột cho mỗi {{b}} cốc sữa. Cần bao nhiêu cốc bột cho
      {{b*k}} cốc sữa?
    hints:
      - text: Lượng sữa đã được nhân với {{k}}, nên lượng bột cũng phải nhân với {{k}}.
    solution:
      - text: "{{b}} x {{k}} = {{b*k}} cốc sữa, nên lượng bột = {{a}} x {{k}} = {{a*k}} cốc."
    options:
      unit: cốc
  m6-unit-rate:
    prompt: "{{q}} quyển vở giá {{c}} nghìn đồng. Vậy một quyển vở giá bao nhiêu nghìn đồng?"
    hints:
      - text: Đơn giá là giá tiền của đúng một sản phẩm.
      - text: Hãy chia tổng số tiền cho số quyển vở.
    solution:
      - text: "{{c}} ÷ {{q}} = {{c/q}} nghìn đồng mỗi quyển."
    options:
      unit: nghìn đồng
  m6-percent-to-fraction:
    prompt: Viết {{p}}% dưới dạng số thập phân.
    hints:
      - text: Phần trăm nghĩa là 'trên một trăm'.
    solution:
      - text: "{{p}}% = {{p}}/100 = {{p/100}}."
  m6-percent-of-amount:
    prompt: "{{p}}% của {{n}} bằng bao nhiêu?"
    hints:
      - text: Đổi tỉ số phần trăm sang số thập phân, rồi nhân.
      - text: "{{p}}% = {{p/100}}."
    solution:
      - text: "{{p}}% của {{n}} = {{p/100}} x {{n}} = {{p*n/100}}."
  m6-percent-discount:
    prompt: >-
      Một chiếc áo khoác giá {{n}} nghìn đồng. Khi giảm giá, áo được bớt {{p}}%. Giá sau khi
      giảm là bao nhiêu nghìn đồng?
    hints:
      - text: Trước hết tính số tiền được giảm, sau đó trừ khỏi giá gốc.
    solution:
      - text: "Số tiền giảm = {{p}}% của {{n}} = {{p*n/100}}."
      - text: "Giá sau giảm = {{n}} - {{p*n/100}} = {{n - p*n/100}} nghìn đồng."
    options:
      unit: nghìn đồng
  m6-variables-meaning:
    prompt: "Biểu thức nào có nghĩa là 'lớn hơn số n là {{k}} đơn vị'?"
    hints:
      - text: "'Lớn hơn ... đơn vị' ứng với phép cộng."
    solution:
      - text: "'Lớn hơn n là {{k}} đơn vị' được viết là n + {{k}}."
    choices:
      - "n + {{k}}"
      - "{{k}}n"
      - "n - {{k}}"
      - "n ÷ {{k}}"
  m6-evaluate-expression:
    prompt: Tính giá trị của biểu thức {{a}}x + {{b}} khi x = {{x}}.
    hints:
      - text: Thay x = {{x}} vào biểu thức và nhớ thực hiện phép nhân trước phép cộng.
    solution:
      - text: "{{a}} x {{x}} = {{a*x}}."
      - text: "{{a*x}} + {{b}} = {{a*x + b}}."
  m6-write-expression:
    prompt: >-
      Một hãng taxi tính {{b}} nghìn đồng phí mở cửa, cộng thêm {{a}} nghìn đồng mỗi ki-lô-mét.
      Hãy viết biểu thức biểu thị số tiền phải trả khi đi k ki-lô-mét.
    hints:
      - text: Phần tiền theo ki-lô-mét phụ thuộc vào k; phí mở cửa thì không.
    solution:
      - text: "Số tiền = {{a}}k + {{b}}."
    options:
      placeholder: ví dụ 5k + 10
  m6-one-step-add:
    prompt: "Giải phương trình:   x + {{a}} = {{b}}"
    hints:
      - text: Làm ngược lại phép cộng {{a}} — trừ {{a}} ở cả hai vế.
    solution:
      - text: "x = {{b}} - {{a}} = {{b - a}}."
  m6-one-step-multiply:
    prompt: "Giải phương trình:   {{a}}x = {{b}}"
    hints:
      - text: Chia cả hai vế cho {{a}}.
    solution:
      - text: "x = {{b}} ÷ {{a}} = {{b/a}}."
  m6-inequality-meaning:
    prompt: "Bất phương trình nào diễn tả 'x ít nhất bằng {{a}}'?"
    hints:
      - text: "'Ít nhất' bao gồm cả chính giá trị đó."
    solution:
      - text: "'Ít nhất bằng {{a}}' nghĩa là x có thể bằng {{a}} hoặc lớn hơn, nên x >= {{a}}."
    choices:
      - "x >= {{a}}"
      - "x > {{a}}"
      - "x <= {{a}}"
      - "x < {{a}}"
  m6-area-rectangle:
    prompt: Một hình chữ nhật có kích thước {{l}} cm và {{w}} cm. Diện tích của nó là bao nhiêu xăng-ti-mét vuông?
    hints:
      - text: Diện tích hình chữ nhật = chiều dài x chiều rộng.
    solution:
      - text: "{{l}} x {{w}} = {{l*w}} xăng-ti-mét vuông."
  m6-area-triangle:
    prompt: >-
      Một tam giác có đáy {{b}} cm và chiều cao tương ứng {{h}} cm. Diện tích của nó là bao
      nhiêu xăng-ti-mét vuông?
    hints:
      - text: Tam giác bằng một nửa hình chữ nhật có cùng đáy và cùng chiều cao.
    solution:
      - text: "Diện tích = 1/2 x {{b}} x {{h}} = {{b*h/2}} xăng-ti-mét vuông."
  m6-area-parallelogram:
    prompt: >-
      Một hình bình hành có đáy {{b}} cm và chiều cao {{h}} cm. Diện tích của nó là bao nhiêu
      xăng-ti-mét vuông?
    hints:
      - text: Khác với tam giác, diện tích hình bình hành bằng đáy nhân chiều cao, không chia đôi.
    solution:
      - text: "Diện tích = {{b}} x {{h}} = {{b*h}} xăng-ti-mét vuông."
  m6-surface-area-prism:
    prompt: >-
      Một chiếc hộp chữ nhật có kích thước {{l}} cm x {{w}} cm x {{h}} cm. Diện tích toàn phần
      của nó là bao nhiêu xăng-ti-mét vuông?
    hints:
      - text: Hình hộp chữ nhật có ba cặp mặt bằng nhau.
      - text: Tính diện tích mỗi mặt khác nhau, cộng lại, rồi nhân đôi.
    solution:
      - text: "Các mặt: {{l*w}}, {{l*h}} và {{w*h}} xăng-ti-mét vuông."
      - text: "Tổng = 2 x ({{l*w}} + {{l*h}} + {{w*h}}) = {{2*(l*w + l*h + w*h)}} xăng-ti-mét vuông."
  m6-volume-prism:
    prompt: >-
      Một bể nước hình hộp chữ nhật có kích thước {{l}} cm x {{w}} cm x {{h}} cm. Thể tích của
      nó là bao nhiêu xăng-ti-mét khối?
    hints:
      - text: Thể tích = chiều dài x chiều rộng x chiều cao.
    solution:
      - text: "{{l}} x {{w}} x {{h}} = {{l*w*h}} xăng-ti-mét khối."
  m6-coordinate-quadrant:
    prompt: Điểm ({{x}}, {{y}}) nằm ở góc phần tư thứ mấy?
    hints:
      - text: Các góc phần tư được đánh số ngược chiều kim đồng hồ, bắt đầu từ góc trên bên phải.
    solution:
      - text: Dấu của x = {{x}} và y = {{y}} quyết định góc phần tư.
    choices:
      - Thứ nhất (x dương, y dương)
      - Thứ hai (x âm, y dương)
      - Thứ ba (x âm, y âm)
      - Thứ tư (x dương, y âm)
  m6-mean:
    prompt: "Tính số trung bình của các điểm kiểm tra sau: {{a}}, {{b}}, {{c}}, {{d}}."
    hints:
      - text: Cộng tất cả các giá trị, rồi chia cho số lượng giá trị.
    solution:
      - text: "Tổng = {{a + b + c + d}}."
      - text: "Số trung bình = {{a + b + c + d}} ÷ 4 = {{(a+b+c+d)/4}}."
  m6-range:
    prompt: "Tính khoảng biến thiên của dãy số liệu sau: {{a}}, {{b}}, {{c}}, {{d}}, {{e}}."
    hints:
      - text: Khoảng biến thiên bằng giá trị lớn nhất trừ giá trị nhỏ nhất.
    solution:
      - text: "Lớn nhất = {{max(a,b,c,d,e)}}, nhỏ nhất = {{min(a,b,c,d,e)}}."
      - text: "Khoảng biến thiên = {{max(a,b,c,d,e) - min(a,b,c,d,e)}}."
  m7-multiply-integers:
    prompt: Tính ({{a}}) x ({{b}}).
    hints:
      - text: Tích của hai số âm là số dương; tích của một số âm và một số dương là số âm.
    solution:
      - text: "{{abs(a)}} x {{abs(b)}} = {{abs(a)*abs(b)}}."
      - text: Xét dấu, kết quả cuối cùng là {{a*b}}.
  m7-divide-integers:
    prompt: Tính ({{p}}) ÷ ({{b}}).
    hints:
      - text: Quy tắc dấu của phép chia giống hệt phép nhân.
    solution:
      - text: "{{p}} ÷ {{b}} = {{p/b}}."
  m7-exponents-evaluate:
    prompt: Tính {{b}} mũ {{e}}.
    hints:
      - text: Số mũ cho biết cơ số được nhân với chính nó bao nhiêu lần.
      - text: "{{b}} mũ {{e}} nghĩa là nhân {{b}} với chính nó {{e}} lần."
    solution:
      - text: "{{b}}^{{e}} = {{b ** e}}."
  m7-absolute-value:
    prompt: Tính |{{a}}| + |{{b}}|.
    hints:
      - text: Giá trị tuyệt đối là khoảng cách đến số 0, nên luôn không âm.
    solution:
      - text: "|{{a}}| = {{abs(a)}} và |{{b}}| = {{abs(b)}}."
      - text: "Tổng = {{abs(a) + abs(b)}}."
  m7-rational-add:
    prompt: Tính {{a}} + ({{b}}). Viết đáp án dưới dạng số thập phân.
    hints:
      - text: Cộng với một số âm nghĩa là di chuyển sang trái trên trục số.
    solution:
      - text: "{{a}} + ({{b}}) = {{a + b : 2}}."
  m7-rational-multiply:
    prompt: Tính ({{a}}) x ({{b}}). Viết đáp án dưới dạng số thập phân.
    hints:
      - text: Một số âm nhân một số dương cho kết quả âm.
    solution:
      - text: "{{a}} x {{b}} = {{a * b : 2}}."
  m7-proportion-solve:
    prompt: "Tìm x:   {{a}}/{{b}} = x/{{b*k}}"
    hints:
      - text: Mẫu số đã được nhân với {{k}}.
      - text: "Nhân chéo: {{a}} x {{b*k}} = x x {{b}}."
    solution:
      - text: "x = {{a}} x {{k}} = {{a*k}}."
  m7-constant-of-proportionality:
    prompt: Trong tương quan tỉ lệ thuận y = {{k}}x, khi x = {{x}} thì y bằng bao nhiêu?
    hints:
      - text: Hệ số tỉ lệ k được nhân với mọi giá trị của x.
    solution:
      - text: "y = {{k}} x {{x}} = {{k*x}}."
  m7-scale-drawing:
    prompt: >-
      Một bản đồ có tỉ lệ 1 cm ứng với {{s}} km. Hai thị trấn cách nhau {{d}} cm trên bản đồ.
      Khoảng cách thực tế giữa chúng là bao nhiêu km?
    hints:
      - text: Mỗi xăng-ti-mét trên bản đồ ứng với {{s}} km ngoài thực tế.
    solution:
      - text: "{{d}} cm x {{s}} km/cm = {{s*d}} km."
  m7-percent-increase:
    prompt: >-
      Một mặt hàng giá {{n}} nghìn đồng tăng thêm {{p}}%. Giá mới là bao nhiêu nghìn đồng?
    hints:
      - text: Tính phần tăng thêm trước, rồi cộng vào giá ban đầu.
    solution:
      - text: "Phần tăng = {{p}}% của {{n}} = {{p*n/100}}."
      - text: "Giá mới = {{n}} + {{p*n/100}} = {{n + p*n/100}}."
    options:
      unit: nghìn đồng
  m7-percent-change-find:
    prompt: Một giá trị tăng từ {{a}} lên {{b}}. Tỉ lệ phần trăm tăng là bao nhiêu?
    hints:
      - text: Tỉ lệ phần trăm thay đổi = (phần thay đổi ÷ giá trị ban đầu) x 100.
      - text: Phần thay đổi là {{b - a}}.
    solution:
      - text: "Phần thay đổi = {{b}} - {{a}} = {{b - a}}."
      - text: "({{b-a}} ÷ {{a}}) x 100 = {{(b-a)/a*100}}%."
  m7-simple-interest:
    prompt: >-
      Gửi {{p}} triệu đồng với lãi suất đơn {{r}}% mỗi năm trong {{t}} năm. Số tiền lãi thu
      được là bao nhiêu triệu đồng?
    hints:
      - text: "Lãi đơn I = P x r x t, trong đó r được viết dưới dạng số thập phân."
    solution:
      - text: "I = {{p}} x {{r/100}} x {{t}} = {{p*r*t/100}} triệu đồng."
    options:
      unit: triệu đồng
  m7-like-terms:
    prompt: Rút gọn {{a}}x + {{b}}x + {{c}}.
    hints:
      - text: Chỉ các hạng tử có cùng phần biến mới cộng được với nhau.
      - text: "{{a}}x + {{b}}x = {{a+b}}x."
    solution:
      - text: "{{a}}x + {{b}}x = {{a+b}}x, còn {{c}} giữ nguyên."
      - text: "Đáp án: {{a+b}}x + {{c}}."
    options:
      placeholder: ví dụ 7x + 3
  m7-distributive:
    prompt: Khai triển {{a}}(x + {{b}}).
    hints:
      - text: Nhân {{a}} với từng hạng tử trong ngoặc.
    solution:
      - text: "{{a}} x x = {{a}}x và {{a}} x {{b}} = {{a*b}}."
      - text: "Đáp án: {{a}}x + {{a*b}}."
    options:
      placeholder: ví dụ 3x + 12
  m7-factorise-linear:
    prompt: Phân tích {{a*g}}x + {{b*g}} thành nhân tử.
    hints:
      - text: Tìm ước chung lớn nhất của {{a*g}} và {{b*g}}.
      - text: ƯCLN là {{g}}.
    solution:
      - text: "{{a*g}}x + {{b*g}} = {{g}}({{a}}x + {{b}})."
    options:
      placeholder: ví dụ 3(2x + 5)
  m7-two-step-equation:
    prompt: "Tìm x:   {{a}}x + {{b}} = {{c}}"
    hints:
      - text: Trước hết khử {{b}} bằng cách trừ nó ở cả hai vế.
      - text: Sau đó chia cả hai vế cho {{a}}.
    solution:
      - text: "{{a}}x = {{c}} - ({{b}}) = {{c - b}}."
      - text: "x = {{c-b}} ÷ {{a}} = {{(c-b)/a}}."
  m7-multi-step-equation:
    prompt: "Tìm x:   {{a}}x + {{b}} = {{c}}x + {{d}}"
    hints:
      - text: Chuyển các hạng tử chứa x về một vế và các số về vế còn lại.
      - text: Trừ {{c}}x ở cả hai vế ta được {{a-c}}x + {{b}} = {{d}}.
    solution:
      - text: "{{a-c}}x = {{d}} - ({{b}}) = {{d - b}}."
      - text: "x = {{d-b}} ÷ {{a-c}} = {{(d-b)/(a-c)}}."
  m7-inequality-solve:
    prompt: "Giải bất phương trình:   -{{a}}x > {{b}}"
    hints:
      - text: Chia cả hai vế cho -{{a}}.
      - text: Khi chia cho một số âm, phải đổi chiều bất đẳng thức.
    solution:
      - text: "Chia cho -{{a}} ta được x < {{-b/a : 2}} — lưu ý dấu đã đổi chiều."
    choices:
      - "x < {{-b/a : 2}}"
      - "x > {{-b/a : 2}}"
      - "x < {{b/a : 2}}"
      - "x > {{b/a : 2}}"
  m7-angle-pairs:
    prompt: Hai góc kề bù, một góc có số đo {{a}} độ. Góc còn lại có số đo bao nhiêu độ?
    hints:
      - text: Hai góc kề bù có tổng số đo bằng 180 độ.
    solution:
      - text: "180 - {{a}} = {{180 - a}} độ."
    options:
      unit: độ
  m7-complementary:
    prompt: Hai góc phụ nhau, một góc có số đo {{a}} độ. Góc còn lại có số đo bao nhiêu độ?
    hints:
      - text: Hai góc phụ nhau có tổng số đo bằng 90 độ.
    solution:
      - text: "90 - {{a}} = {{90 - a}} độ."
    options:
      unit: độ
  m7-parallel-lines:
    prompt: >-
      Hai đường thẳng song song bị cắt bởi một đường thẳng thứ ba. Một góc có số đo {{a}} độ.
      Góc trong cùng phía với nó có số đo bao nhiêu độ?
    hints:
      - text: Hai góc trong cùng phía giữa hai đường thẳng song song có tổng bằng 180 độ.
      - text: Các góc đồng vị và so le trong thì bằng nhau; góc trong cùng phía thì không.
    solution:
      - text: "180 - {{a}} = {{180 - a}} độ."
    options:
      unit: độ
  m7-triangle-angle:
    prompt: Một tam giác có hai góc là {{a}} độ và {{b}} độ. Góc thứ ba có số đo bao nhiêu độ?
    hints:
      - text: Tổng ba góc trong một tam giác bằng 180 độ.
    solution:
      - text: "180 - {{a}} - {{b}} = {{180 - a - b}} độ."
    options:
      unit: độ
  m7-circumference:
    prompt: >-
      Một đường tròn có bán kính {{r}} cm. Tính chu vi của nó theo cm, làm tròn đến 2 chữ số
      thập phân. Lấy pi = 3,14159.
    hints:
      - text: "Chu vi C = 2 pi r."
    solution:
      - text: "C = 2 x pi x {{r}} = {{2*pi*r : 2}} cm."
  m7-circle-area:
    prompt: >-
      Một hình tròn có bán kính {{r}} cm. Tính diện tích của nó theo cm vuông, làm tròn đến 2
      chữ số thập phân. Lấy pi = 3,14159.
    hints:
      - text: "Diện tích A = pi r bình phương — bình phương bán kính, không phải nhân đôi."
    solution:
      - text: "A = pi x {{r}}^2 = pi x {{r*r}} = {{pi*r*r : 2}} cm vuông."
  m7-cylinder-volume:
    prompt: >-
      Một hình trụ có bán kính đáy {{r}} cm và chiều cao {{h}} cm. Tính thể tích của nó theo cm
      khối, làm tròn đến 2 chữ số thập phân. Lấy pi = 3,14159.
    hints:
      - text: Thể tích = diện tích mặt đáy x chiều cao.
    solution:
      - text: "Diện tích đáy = pi x {{r*r}} = {{pi*r*r : 2}} cm vuông."
      - text: "Thể tích = {{pi*r*r : 2}} x {{h}} = {{pi*r*r*h : 2}} cm khối."
  m7-simple-probability:
    prompt: >-
      Một túi có {{r}} viên bi đỏ và {{b}} viên bi xanh. Lấy ngẫu nhiên một viên. Xác suất lấy
      được viên bi đỏ là bao nhiêu? Viết đáp án dưới dạng phân số tối giản.
    hints:
      - text: Xác suất = số kết quả thuận lợi ÷ tổng số kết quả có thể.
      - text: Tổng cộng có {{r + b}} viên bi.
    solution:
      - text: "P(đỏ) = {{r}}/{{r + b}}, rút gọn thành {{p}}/{{p+q}}."
  m7-compound-probability:
    prompt: >-
      Tung một đồng xu cân đối và gieo một con xúc xắc {{n}} mặt cân đối. Xác suất được mặt
      ngửa và số {{target}} là bao nhiêu? Viết đáp án dưới dạng phân số.
    hints:
      - text: Với hai biến cố độc lập, ta nhân các xác suất thành phần.
      - text: "P(ngửa) = 1/2 và P({{target}}) = 1/{{n}}."
    solution:
      - text: "1/2 x 1/{{n}} = 1/{{2*n}}."
  m7-compare-datasets:
    prompt: >-
      Lớp A có điểm trung bình {{a}} với khoảng biến thiên {{ra}}. Lớp B có điểm trung bình
      {{b}} với khoảng biến thiên {{rb}}. Khẳng định nào sau đây là đúng?
    hints:
      - text: Số trung bình đo mức trung bình; khoảng biến thiên đo độ phân tán.
    solution:
      - text: "So sánh số trung bình: {{a}} với {{b}}."
    choices:
      - Lớp A có điểm trung bình cao hơn
      - Lớp B có điểm trung bình cao hơn
      - Hai lớp có điểm trung bình bằng nhau
  m7-sampling:
    prompt: >-
      Trong một mẫu ngẫu nhiên gồm {{s}} học sinh, có {{f}} em nói rằng mình đi bộ đến trường.
      Hãy ước lượng số học sinh đi bộ đến trường trong tổng số {{total}} học sinh của trường.
    hints:
      - text: Tỉ lệ trong mẫu được xem là xấp xỉ tỉ lệ của toàn trường.
      - text: Toàn trường lớn gấp {{k}} lần mẫu.
    solution:
      - text: "{{total}} ÷ {{s}} = {{k}}, nên nhân số học sinh trong mẫu với {{k}}."
      - text: "{{f}} x {{k}} = {{f*k}} học sinh."
  m8-perfect-square:
    prompt: Tính căn bậc hai của {{n}}.
    hints:
      - text: "Hãy tự hỏi: số nào nhân với chính nó thì được {{n}}?"
    solution:
      - text: "{{r}} x {{r}} = {{n}}, nên căn bậc hai của {{n}} là {{r}}."
  m8-estimate-root:
    prompt: Căn bậc hai của {{n}} nằm giữa hai số tự nhiên liên tiếp nào?
    hints:
      - text: Hãy tìm số chính phương gần nhất nhỏ hơn và lớn hơn {{n}}.
    solution:
      - text: "{{r*r}} < {{n}} < {{(r+1)*(r+1)}}, nên căn bậc hai nằm giữa {{r}} và {{r+1}}."
    choices:
      - "{{r}} và {{r+1}}"
      - "{{r-1}} và {{r}}"
      - "{{r+1}} và {{r+2}}"
      - "{{r+2}} và {{r+3}}"
  m8-classify-number:
    prompt: Chọn tất cả các số vô tỉ trong các số dưới đây.
    hints:
      - text: Số vô tỉ không viết được dưới dạng phân số của hai số nguyên.
      - text: Căn bậc hai của một số chính phương là số hữu tỉ.
    solution:
      - text: "{{n}} là số chính phương ({{r}}^2), nên căn của nó là số tự nhiên {{r}}."
      - text: "{{m}} không phải số chính phương nên căn của nó là số vô tỉ, giống như pi."
    choices:
      - căn bậc hai của {{m}}
      - pi
      - căn bậc hai của {{n}}
      - "{{r}}/4"
  m8-index-law-product:
    prompt: >-
      Rút gọn {{b}}^{{m}} x {{b}}^{{n}} thành một luỹ thừa của {{b}}. Số mũ mới là bao nhiêu?
    hints:
      - text: Khi nhân hai luỹ thừa cùng cơ số, ta cộng các số mũ.
    solution:
      - text: "{{b}}^{{m}} x {{b}}^{{n}} = {{b}}^({{m}}+{{n}}) = {{b}}^{{m+n}}."
  m8-index-law-quotient:
    prompt: Rút gọn {{b}}^{{m}} ÷ {{b}}^{{n}} thành một luỹ thừa của {{b}}. Số mũ mới là bao nhiêu?
    hints:
      - text: Khi chia hai luỹ thừa cùng cơ số, ta trừ các số mũ.
    solution:
      - text: "{{b}}^{{m}} ÷ {{b}}^{{n}} = {{b}}^{{m-n}}."
  m8-zero-negative-index:
    prompt: Giá trị của {{b}}^-{{n}} là bao nhiêu?
    hints:
      - text: Số mũ âm nghĩa là lấy nghịch đảo.
    solution:
      - text: "{{b}}^-{{n}} = 1 / {{b}}^{{n}} = 1/{{b ** n}}."
    choices:
      - "1 / {{b ** n}}"
      - "-{{b ** n}}"
      - "{{b ** n}}"
      - "0"
  m8-scientific-notation:
    prompt: Viết {{a}} x 10^{{e}} dưới dạng số thông thường.
    hints:
      - text: Dịch dấu phẩy thập phân sang phải {{e}} chữ số.
    solution:
      - text: "{{a}} x 10^{{e}} = {{a * 10 ** e}}."
  m8-function-or-not:
    prompt: >-
      Một tương ứng là hàm số nếu mỗi giá trị đầu vào chỉ ứng với đúng một giá trị đầu ra.
      Đúng hay sai: tập các điểm ({{a}}, 1), ({{b}}, 2), ({{c}}, 3) là một hàm số.
    hints:
      - text: Chỉ khi một đầu vào xuất hiện hai lần với hai đầu ra khác nhau thì mới không phải hàm số.
    solution:
      - text: "Các giá trị đầu vào là {{a}}, {{b}} và {{c}} — hãy kiểm tra xem có giá trị nào lặp lại không."
  m8-function-table:
    prompt: Cho hàm số y = {{m}}x + {{c}}. Khi x = {{x}} thì y bằng bao nhiêu?
    hints:
      - text: Thay x = {{x}} vào và thực hiện phép nhân trước phép cộng.
    solution:
      - text: "y = {{m}} x {{x}} + {{c}} = {{m*x}} + {{c}} = {{m*x + c}}."
  m8-gradient:
    prompt: Tính hệ số góc của đường thẳng đi qua hai điểm ({{x1}}, {{y1}}) và ({{x2}}, {{y2}}).
    hints:
      - text: "Hệ số góc = độ tăng theo trục tung ÷ độ tăng theo trục hoành = (y2 - y1) ÷ (x2 - x1)."
      - text: "Độ tăng tung độ = {{y2 - y1}}, độ tăng hoành độ = {{x2 - x1}}."
    solution:
      - text: "m = ({{y2}} - {{y1}}) ÷ ({{x2}} - {{x1}}) = {{y2-y1}} ÷ {{x2-x1}} = {{(y2-y1)/(x2-x1)}}."
  m8-slope-intercept-read:
    prompt: Với đường thẳng y = {{m}}x + {{c}}, tung độ gốc bằng bao nhiêu?
    hints:
      - text: "Trong y = mx + c, tung độ gốc là c — giá trị của y khi x = 0."
    solution:
      - text: "Thay x = 0 ta được y = {{c}}."
  m8-write-linear-equation:
    prompt: >-
      Một đường thẳng có hệ số góc {{m}} và đi qua điểm (0, {{c}}). Hãy viết phương trình của nó
      ở dạng y = mx + c (chỉ ghi vế phải).
    hints:
      - text: Điểm (0, {{c}}) chính là tung độ gốc.
    solution:
      - text: "y = {{m}}x + {{c}}."
    options:
      placeholder: ví dụ 3x - 4
  m8-systems-graphing:
    prompt: >-
      Hai đường thẳng y = {{m1}}x + {{c1}} và y = {{m2}}x + {{c2}} cắt nhau tại một điểm.
      Hoành độ của giao điểm đó bằng bao nhiêu?
    hints:
      - text: Tại giao điểm, hai giá trị y bằng nhau, nên ta cho hai biểu thức bằng nhau.
    solution:
      - text: "{{m1}}x + {{c1}} = {{m2}}x + {{c2}}."
      - text: "{{m1 - m2}}x = {{c2 - c1}}, nên x = {{(c2-c1)/(m1-m2)}}."
  m8-systems-elimination:
    prompt: "Giải hệ phương trình và cho biết giá trị của x. x + y = {{s}} x - y = {{d}}"
    hints:
      - text: Cộng hai phương trình sẽ khử được y.
      - text: "(x + y) + (x - y) = 2x."
    solution:
      - text: "Cộng vế với vế: 2x = {{s}} + {{d}} = {{s + d}}."
      - text: "x = {{(s+d)/2}}."
  m8-pythagoras-hypotenuse:
    prompt: >-
      Một tam giác vuông có hai cạnh góc vuông là {{a}} cm và {{b}} cm. Cạnh huyền dài bao
      nhiêu xăng-ti-mét?
    hints:
      - text: "Áp dụng định lí Pythagore: a bình phương + b bình phương = c bình phương."
      - text: "{{a}}^2 + {{b}}^2 = {{a*a}} + {{b*b}} = {{a*a + b*b}}."
    solution:
      - text: "c^2 = {{a*a}} + {{b*b}} = {{a*a + b*b}}."
      - text: "c = căn bậc hai của {{a*a + b*b}} = {{sqrt(a*a + b*b)}} cm."
  m8-pythagoras-leg:
    prompt: >-
      Một tam giác vuông có cạnh huyền {{c}} cm và một cạnh góc vuông {{a}} cm. Cạnh góc vuông
      còn lại dài bao nhiêu xăng-ti-mét?
    hints:
      - text: "Biến đổi thành b bình phương = c bình phương - a bình phương."
    solution:
      - text: "b^2 = {{c*c}} - {{a*a}} = {{c*c - a*a}}."
      - text: "b = {{sqrt(c*c - a*a)}} cm."
  m8-distance-formula:
    prompt: Tính khoảng cách giữa hai điểm ({{x1}}, {{y1}}) và ({{x2}}, {{y2}}).
    hints:
      - text: "Hãy vẽ một tam giác vuông: khoảng cách ngang và dọc chính là hai cạnh góc vuông."
      - text: "Khoảng cách ngang = {{x2-x1}}, khoảng cách dọc = {{y2-y1}}."
    solution:
      - text: "d^2 = {{(x2-x1)**2}} + {{(y2-y1)**2}} = {{(x2-x1)**2 + (y2-y1)**2}}."
      - text: "d = {{sqrt((x2-x1)**2 + (y2-y1)**2)}}."
  m8-translation:
    prompt: >-
      Điểm ({{x}}, {{y}}) được tịnh tiến sang phải {{dx}} đơn vị và lên trên {{dy}} đơn vị.
      Hoành độ mới bằng bao nhiêu?
    hints:
      - text: Dịch sang phải làm tăng hoành độ.
    solution:
      - text: "{{x}} + {{dx}} = {{x + dx}}."
  m8-similar-figures:
    prompt: >-
      Hai tam giác đồng dạng. Tam giác thứ nhất có một cạnh {{a}} cm tương ứng với cạnh {{b}} cm
      của tam giác thứ hai. Một cạnh khác của tam giác thứ nhất dài {{c}} cm. Cạnh tương ứng
      của tam giác thứ hai dài bao nhiêu xăng-ti-mét?
    hints:
      - text: Tìm tỉ số đồng dạng bằng cách chia hai cạnh tương ứng.
      - text: "Tỉ số đồng dạng = {{b}} ÷ {{a}} = {{k}}."
    solution:
      - text: "Tỉ số đồng dạng là {{k}}, nên {{c}} x {{k}} = {{c*k}} cm."
  m8-scatter-association:
    prompt: >-
      Một biểu đồ tán xạ cho thấy khi số giờ ôn tập tăng thì điểm thi cũng tăng. Em mô tả mối
      liên hệ này như thế nào?
    hints:
      - text: Khi hai đại lượng cùng tăng, mối liên hệ là tương quan thuận.
      - text: Nhớ rằng tương quan không đồng nghĩa với quan hệ nhân quả.
    solution:
      - text: Hai đại lượng cùng tăng, nên đây là tương quan thuận.
      - text: Chỉ riêng biểu đồ tán xạ thì không thể khẳng định quan hệ nhân quả.
    choices:
      - Tương quan thuận
      - Tương quan nghịch
      - Không có tương quan
      - Nó chứng minh ôn tập làm điểm cao hơn
  m8-line-of-best-fit:
    prompt: >-
      Một đường thẳng phù hợp nhất có phương trình y = {{m}}x + {{c}}. Hãy dùng nó để dự đoán y
      khi x = {{x}}.
    hints:
      - text: Thay x = {{x}} vào phương trình.
    solution:
      - text: "y = {{m}} x {{x}} + {{c}} = {{m*x + c}}."
  m9-expand-binomials:
    prompt: Khai triển và rút gọn (x + {{a}})(x + {{b}}).
    hints:
      - text: Nhân từng hạng tử của ngoặc thứ nhất với từng hạng tử của ngoặc thứ hai.
      - text: Hệ số của x là {{a}} + {{b}} và hạng tử tự do là {{a}} x {{b}}.
    solution:
      - text: "x nhân x = x^2."
      - text: "Các hạng tử chứa x: {{a}}x + {{b}}x = {{a+b}}x."
      - text: "Hạng tử tự do: {{a}} x {{b}} = {{a*b}}."
    options:
      placeholder: ví dụ x^2 + 5x + 6
  m9-perfect-square-expand:
    prompt: Khai triển và rút gọn (x + {{a}})^2.
    hints:
      - text: "(x + a)^2 nghĩa là (x + a)(x + a) — không phải x^2 + a^2."
    solution:
      - text: "(x + {{a}})^2 = x^2 + 2({{a}})x + {{a}}^2 = x^2 + {{2*a}}x + {{a*a}}."
  m9-factorise-quadratic:
    prompt: Phân tích x^2 + {{a + b}}x + {{a*b}} thành nhân tử.
    hints:
      - text: Hãy tìm hai số có tích bằng {{a*b}} và tổng bằng {{a+b}}.
    solution:
      - text: "{{a}} x {{b}} = {{a*b}} và {{a}} + {{b}} = {{a+b}}."
      - text: "Vậy kết quả phân tích là (x + {{a}})(x + {{b}})."
    choices:
      - "(x + {{a}})(x + {{b}})"
      - "(x - {{a}})(x - {{b}})"
      - "(x + {{a+b}})(x + {{a*b}})"
      - "(x + {{a}})(x - {{b}})"
  m9-difference-of-squares:
    prompt: Phân tích x^2 - {{a*a}} thành nhân tử.
    hints:
      - text: "Đây là hiệu hai bình phương: a^2 - b^2 = (a + b)(a - b)."
    solution:
      - text: "x^2 - {{a*a}} = x^2 - {{a}}^2 = (x + {{a}})(x - {{a}})."
    choices:
      - "(x + {{a}})(x - {{a}})"
      - "(x - {{a}})(x - {{a}})"
      - "(x + {{a}})(x + {{a}})"
      - Không phân tích được
  m9-simplify-surd:
    prompt: >-
      Rút gọn căn bậc hai của {{n}} về dạng a x căn(b). Viết theo mẫu, ví dụ 3root2.
    hints:
      - text: Hãy tìm số chính phương lớn nhất là ước của {{n}}.
      - text: "{{n}} = {{a*a}} x {{b}}."
    solution:
      - text: "root({{n}}) = root({{a*a}}) x root({{b}}) = {{a}}root{{b}}."
  m9-algebraic-fraction:
    prompt: Rút gọn phân thức ({{a}}x + {{a*b}}) / {{a}}.
    hints:
      - text: Hãy phân tích tử thức thành nhân tử trước.
      - text: "{{a}}x + {{a*b}} = {{a}}(x + {{b}})."
    solution:
      - text: "{{a}}(x + {{b}}) ÷ {{a}} = x + {{b}}."
  m9-quadratic-factorising:
    prompt: >-
      Giải phương trình x^2 + {{a + b}}x + {{a*b}} = 0. Cho biết nghiệm lớn hơn trong hai nghiệm.
    hints:
      - text: "Phân tích thành (x + p)(x + q) = 0."
      - text: "Khi đó hoặc x + p = 0, hoặc x + q = 0."
    solution:
      - text: "(x + {{a}})(x + {{b}}) = 0."
      - text: "Vậy x = {{-a}} hoặc x = {{-b}}; nghiệm lớn hơn là {{-min(a,b)}}."
  m9-quadratic-formula-discriminant:
    prompt: "Với phương trình {{a}}x^2 + {{b}}x + {{c}} = 0, hãy tính biệt thức b^2 - 4ac."
    hints:
      - text: "Biệt thức là b^2 - 4ac."
      - text: "Ở đây a = {{a}}, b = {{b}} và c = {{c}}."
    solution:
      - text: "b^2 = {{b*b}} và 4ac = {{4*a*c}}."
      - text: "Biệt thức = {{b*b}} - {{4*a*c}} = {{b*b - 4*a*c}}."
  m9-parabola-vertex:
    prompt: "Với parabol y = x^2 + {{b}}x + {{c}}, hãy tìm hoành độ của đỉnh."
    hints:
      - text: "Trục đối xứng có phương trình x = -b ÷ (2a)."
      - text: "Ở đây a = 1, nên x = -{{b}} ÷ 2."
    solution:
      - text: "x = -({{b}}) ÷ 2 = {{-b/2}}."
  m9-parabola-direction:
    prompt: "Parabol y = {{a}}x^2 + {{b}}x + {{c}} có bề lõm quay về phía nào?"
    hints:
      - text: Hãy xét dấu của hệ số của x^2.
    solution:
      - text: "Hệ số của x^2 là {{a}}, dấu của nó quyết định hướng bề lõm."
    choices:
      - Lên trên (có điểm cực tiểu)
      - Xuống dưới (có điểm cực đại)
      - Đó là một đường thẳng
  m9-trig-ratio-identify:
    prompt: >-
      Trong một tam giác vuông, tỉ số nào bằng cạnh đối chia cho cạnh huyền?
    hints:
      - text: Hãy nhớ quy tắc SOH CAH TOA.
    solution:
      - text: "SOH: sin = cạnh đối ÷ cạnh huyền."
    choices:
      - sin
      - cos
      - tan
      - nghịch đảo của tan
  m9-trig-find-side:
    prompt: >-
      Một tam giác vuông có cạnh huyền {{h}} cm và một góc nhọn {{a}} độ. Tính độ dài cạnh đối
      diện góc đó theo cm, làm tròn đến 2 chữ số thập phân.
    hints:
      - text: Đã biết cạnh huyền và cần tìm cạnh đối, nên dùng sin.
      - text: "cạnh đối = cạnh huyền x sin(góc)."
    solution:
      - text: "cạnh đối = {{h}} x sin({{a}} độ) = {{h * sin(radians(a)) : 2}} cm."
  m9-trig-find-angle:
    prompt: >-
      Một tam giác vuông có cạnh đối {{o}} cm và cạnh huyền {{h}} cm. Tính số đo góc theo độ,
      làm tròn đến 1 chữ số thập phân.
    hints:
      - text: Hãy dùng hàm sin ngược (arcsin).
      - text: "góc = arcsin(cạnh đối ÷ cạnh huyền)."
    solution:
      - text: "sin(góc) = {{o}} ÷ {{h}} = {{o/h : 4}}."
      - text: "góc = {{degrees(asin(o/h)) : 1}} độ."
    options:
      unit: độ
  m9-elevation:
    prompt: >-
      Từ một điểm cách chân tháp {{d}} m, góc nâng đến đỉnh tháp là {{a}} độ. Tháp cao bao
      nhiêu mét, làm tròn đến 2 chữ số thập phân?
    hints:
      - text: Đã biết cạnh kề và cần tìm cạnh đối, nên dùng tan.
      - text: "chiều cao = khoảng cách x tan(góc)."
    solution:
      - text: "chiều cao = {{d}} x tan({{a}} độ) = {{d * tan(radians(a)) : 2}} m."
  m9-cylinder-surface-area:
    prompt: >-
      Một hình trụ kín có bán kính đáy {{r}} cm và chiều cao {{h}} cm. Tính diện tích toàn phần
      theo cm vuông, làm tròn đến 2 chữ số thập phân. Lấy pi = 3,14159.
    hints:
      - text: Diện tích toàn phần = hai hình tròn đáy + mặt xung quanh.
      - text: "A = 2 pi r^2 + 2 pi r h."
    solution:
      - text: "Hai đáy: 2 x pi x {{r*r}} = {{2*pi*r*r : 2}}."
      - text: "Mặt xung quanh: 2 x pi x {{r}} x {{h}} = {{2*pi*r*h : 2}}."
      - text: "Tổng = {{2*pi*r*(r+h) : 2}} cm vuông."
  m9-quartiles:
    prompt: >-
      Một mẫu số liệu có tứ phân vị thứ nhất {{q1}} và tứ phân vị thứ ba {{q3}}. Khoảng tứ phân
      vị bằng bao nhiêu?
    hints:
      - text: "Khoảng tứ phân vị bằng Q3 - Q1."
    solution:
      - text: "IQR = {{q3}} - {{q1}} = {{q3 - q1}}."
  m9-box-plot-read:
    prompt: >-
      Một biểu đồ hộp có giá trị nhỏ nhất {{mn}}, Q1 {{q1}}, trung vị {{med}}, Q3 {{q3}} và giá
      trị lớn nhất {{mx}}. Khoảng biến thiên bằng bao nhiêu?
    hints:
      - text: Khoảng biến thiên dùng hai giá trị cực trị, không dùng tứ phân vị.
    solution:
      - text: "Khoảng biến thiên = {{mx}} - {{mn}} = {{mx - mn}}."

