  - slug: lesson-math-12-optimisation
    title: Designing the Cheapest Possible Tin Can
    topic: math-12-asymptotes-optimisation
    skill: math-12-optimisation
    estimated_minutes: 24
    summary: A real manufacturing question, answered exactly by setting one derivative to zero.
    objectives:
      - Translate a constraint into a function of a single variable
      - Use the derivative to locate a minimum
      - Confirm a stationary point is the optimum required
    attribution: Written for HieuTrienEducation. Informed by OpenStax Calculus Volume 1 (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          A factory makes cylindrical cans holding 500 ml. Metal costs money, so they want the
          shape that uses the least of it.

          Should the can be tall and narrow, or short and wide? There are infinitely many
          cylinders with a volume of 500 ml, and exactly one of them uses the least metal.
      - type: text
        markdown: |
          ### The three steps

          Optimisation problems all have the same skeleton:

          1. Write the quantity to optimise. Here, the surface area.
          2. Use the constraint to eliminate every variable but one.
          3. Differentiate, set to zero, and solve.
      - type: example
        title: Setting up the can
        steps:
          - text: "For a closed cylinder of radius r and height h:"
            math: "A = 2\\pi r^2 + 2\\pi r h, \\qquad V = \\pi r^2 h = 500"
          - text: "The constraint gives h in terms of r."
            math: "h = \\frac{500}{\\pi r^2}"
          - text: "Substituting removes h entirely — now A depends on r alone."
            math: "A(r) = 2\\pi r^2 + \\frac{1000}{r}"
      - type: example
        title: Minimising it
        steps:
          - text: "Differentiate."
            math: "A'(r) = 4\\pi r - \\frac{1000}{r^2}"
          - text: "Set to zero."
            math: "4\\pi r = \\frac{1000}{r^2} \\;\\Rightarrow\\; r^3 = \\frac{250}{\\pi}"
          - text: "Solve."
            math: "r = 4.30\\text{ cm}"
          - text: "And the height:"
            math: "h = \\frac{500}{\\pi (4.30)^2} = 8.60\\text{ cm}"
          - text: "So h = 2r exactly — the optimal can is as tall as it is wide."
      - type: interactive
        widget: function-plot
        config:
          functions:
            - {expression: "2*3.14159*x*x + 1000/x", label: "A(r) = 2πr² + 1000/r", color: "primary"}
            - {expression: "348.7", label: "minimum ≈ 349 cm²", color: "muted"}
          xRange: [1, 12]
          yRange: [0, 900]
          axisLabels: {x: "radius r (cm)", y: "surface area (cm²)"}
      - type: callout
        variant: note
        title: Confirming it is a minimum
        text: >-
          A'(r) = 0 only says the tangent is horizontal — that could be a maximum. Check the
          second derivative: A''(r) = 4π + 2000/r³, which is positive for all r > 0. The curve
          is concave up everywhere, so this stationary point is a minimum.
      - type: text
        markdown: |
          ### Why real cans are not this shape

          Look at a can of drink and it is clearly taller than it is wide. The mathematics is not
          wrong — the model is incomplete. Real manufacturing adds costs the model ignored: the
          top and bottom are thicker gauge metal, seams cost money, and cans have to fit a hand
          and stack on a shelf.

          Feed those into the objective function and the optimum moves. That is a feature of
          modelling, not a failure of calculus.
      - type: callout
        variant: warning
        title: Check the endpoints
        text: >-
          On a closed interval, the greatest or least value can occur at an endpoint rather than
          a stationary point. Always evaluate the function at both ends as well before declaring
          an answer.
      - type: practice
        skill: math-12-optimisation
      - type: summary
        points:
          - Write the quantity to optimise, then use the constraint to reduce it to one variable
          - Differentiate and set to zero to find stationary points
          - Use the second derivative or the sign of the first to classify them
          - Check endpoints, and check the answer makes sense in context

  - slug: lesson-math-12-integral
    title: Recovering the Journey from the Speedometer
    topic: math-12-definite-integrals
    skill: math-12-definite-integral
    estimated_minutes: 22
    summary: If a derivative turns distance into speed, integration turns speed back into distance.
    objectives:
      - Interpret a definite integral as an accumulated total
      - Apply the fundamental theorem of calculus
      - Relate the integral to the area under a curve
    attribution: Written for HieuTrienEducation. Informed by OpenStax Calculus Volume 1 (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          Suppose you recorded your speed every instant of a journey but never looked at the
          odometer. Could you work out how far you travelled?

          If the speed were constant, easily: distance = speed × time. But it was not constant —
          you accelerated, braked, stopped at lights.
      - type: text
        markdown: |
          ### Chop it up

          Split the journey into intervals so short that the speed is nearly constant within
          each. Over one such interval the distance is approximately $v \times \Delta t$ — the
          area of a thin rectangle under the speed-time graph.

          Add all the rectangles. Then make them thinner and take more of them. In the limit,
          the sum of rectangle areas becomes the exact area under the curve:

          $$\text{distance} = \int_{a}^{b} v(t)\,dt$$
      - type: callout
        variant: note
        title: What an integral actually is
        text: >-
          A definite integral is an accumulated total: a rate multiplied by an interval, summed
          over the whole range. Speed accumulates into distance, flow rate into volume, power
          into energy, marginal cost into total cost. The area interpretation is a picture of
          that sum.
      - type: text
        markdown: |
          ### The theorem that makes it computable

          Summing infinitely many rectangles is not a practical method. The **fundamental
          theorem of calculus** replaces it with something you can do by hand:

          $$\int_a^b f(x)\,dx = F(b) - F(a) \quad\text{where } F'(x) = f(x)$$

          To find an area, find an antiderivative and subtract its values at the two ends. This
          is one of the most consequential results in mathematics: it connects two problems —
          tangents and areas — that had been studied separately for two thousand years.
      - type: example
        title: A car accelerating uniformly
        steps:
          - text: "A car's speed is v(t) = 4t m/s. How far does it travel in the first 5 seconds?"
          - text: "Find an antiderivative of 4t."
            math: "F(t) = 2t^2"
          - text: "Evaluate at the limits and subtract."
            math: "\\int_0^5 4t\\,dt = F(5) - F(0) = 50 - 0 = 50\\text{ m}"
          - text: "Check it geometrically: the speed-time graph is a triangle of base 5 and height 20."
            math: "\\text{area} = \\tfrac{1}{2}(5)(20) = 50\\text{ m} \\;\\checkmark"
      - type: interactive
        widget: function-plot
        config:
          functions:
            - {expression: "4*x", label: "v(t) = 4t", color: "primary"}
          xRange: [0, 6]
          yRange: [0, 26]
          axisLabels: {x: "time (s)", y: "speed (m/s)"}
      - type: table
        headers: ["Integrate this rate", "Over", "And you get"]
        rows:
          - ["Speed (m/s)", "Time", "Distance (m)"]
          - ["Flow rate (l/s)", "Time", "Volume (l)"]
          - ["Power (W)", "Time", "Energy (J)"]
          - ["Force (N)", "Distance", "Work done (J)"]
          - ["Marginal cost", "Quantity", "Total cost"]
      - type: callout
        variant: warning
        title: Area below the axis counts as negative
        text: >-
          If the curve dips below the horizontal axis, the integral subtracts that region. For a
          velocity that goes negative this is exactly right — it means moving backwards, and the
          integral correctly gives *displacement*. But if you genuinely want total area, split
          the integral at each crossing and add the absolute values.
      - type: practice
        skill: math-12-definite-integral
      - type: summary
        points:
          - A definite integral accumulates a rate over an interval
          - Geometrically it is the signed area under the curve
          - The fundamental theorem evaluates it as F(b) − F(a)
          - Regions below the axis contribute negatively

  - slug: lesson-math-12-bayes
    title: Your Positive Test Result Probably Is Not One
    topic: math-12-conditional
    skill: math-12-bayes
    estimated_minutes: 24
    summary: A 99% accurate test for a rare disease is wrong most of the time it says yes.
    objectives:
      - Apply the law of total probability
      - Use Bayes' formula to reverse a conditional probability
      - Explain why base rates dominate when an event is rare
    attribution: Written for HieuTrienEducation. Informed by OpenStax Introductory Statistics 2e (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          A disease affects 1 in 1,000 people. A test for it is 99% accurate: it catches 99% of
          people who have the disease, and wrongly flags only 1% of healthy people.

          You test positive. What is the probability you have the disease?

          Most people say 99%. Most doctors, asked without warning, say something above 80%. The
          actual answer is about **9%**.
      - type: text
        markdown: |
          ### Count actual people

          Forget the formula for a moment. Imagine testing 100,000 people.

          - **100** have the disease (1 in 1,000). The test catches 99 of them.
          - **99,900** are healthy. The test wrongly flags 1% of them — that is **999** people.

          So 99 + 999 = 1,098 people test positive. Of those, only 99 actually have the disease.
      - type: math
        latex: "P(\\text{disease} \\mid +) = \\frac{99}{1098} \\approx 0.090"
      - type: callout
        variant: note
        title: Where the intuition fails
        text: >-
          The healthy group is a thousand times larger than the sick group. Even a small error
          rate applied to a huge population produces more false positives than there are true
          positives in the small one. The test is not bad — the disease is rare, and rarity
          dominates.
      - type: table
        headers: ["", "Has disease", "Healthy", "Total"]
        rows:
          - ["Tests positive", "99", "999", "1,098"]
          - ["Tests negative", "1", "98,901", "98,902"]
          - ["Total", "100", "99,900", "100,000"]
      - type: text
        markdown: |
          ### The formula

          What the table did by counting, Bayes' formula does algebraically:

          $$P(A \mid B) = \frac{P(B \mid A)\,P(A)}{P(B)}$$

          and the denominator usually needs the **law of total probability** — every route to a
          positive result, added up:

          $$P(B) = P(B \mid A)P(A) + P(B \mid \text{not }A)P(\text{not }A)$$
      - type: example
        title: The same calculation symbolically
        steps:
          - text: "P(disease) = 0.001, P(+ | disease) = 0.99, P(+ | healthy) = 0.01."
          - text: "Total probability of a positive:"
            math: "P(+) = (0.99)(0.001) + (0.01)(0.999) = 0.00099 + 0.00999 = 0.01098"
          - text: "Apply Bayes:"
            math: "P(\\text{disease} \\mid +) = \\frac{0.00099}{0.01098} = 0.090"
          - text: "Identical to the counting argument, as it must be."
      - type: callout
        variant: tip
        title: Why a second test changes everything
        text: >-
          After one positive result your probability rose from 0.1% to 9% — ninety times higher.
          Test again and that 9% becomes the new base rate, and a second positive pushes it past
          90%. This is exactly why screening programmes always confirm before treating.
      - type: callout
        variant: warning
        title: Do not confuse the two directions
        text: >-
          P(positive | disease) and P(disease | positive) are entirely different numbers. The
          first is a property of the test, near 99%. The second depends on how common the
          disease is, and here it is 9%. Swapping them is the single most consequential error in
          applied probability.
      - type: practice
        skill: math-12-bayes
      - type: summary
        points:
          - Bayes' formula reverses a conditional probability
          - The law of total probability supplies the denominator
          - When an event is rare, false positives outnumber true positives
          - P(B given A) and P(A given B) are different quantities
