# Mathematics lessons for grades 10-12 — original content authored for HieuTrienEducation.
#
# Upper-secondary mathematics loses students at the point where it stops obviously being about
# anything. Each of these lessons therefore opens with a question someone actually needed to
# answer, and derives the machinery from it.
lessons:
  # ------------------------------------------------------------------------------------
  # Grade 10
  # ------------------------------------------------------------------------------------
  - slug: lesson-math-10-surveying
    title: Measuring a Distance You Cannot Walk
    topic: math-10-triangle-relations
    skill: math-10-law-of-cosines
    estimated_minutes: 22
    summary: How to find the width of a river without crossing it.
    objectives:
      - Apply the law of sines to find an unknown side or angle
      - Apply the law of cosines when two sides and the included angle are known
      - Choose the correct rule from the information available
    attribution: Written for HieuTrienEducation. Trigonometric treatment informed by OpenStax Algebra and Trigonometry 2e (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          You need the distance across a river. You cannot swim it, and there is no bridge for
          kilometres. But you can walk along your own bank, and you can measure angles.

          That is enough. It has been enough since antiquity, and it is how every map of a
          coastline was made before satellites.
      - type: text
        markdown: |
          ### Beyond the right angle

          In grade 9 the trigonometric ratios required a right angle. Most real triangles do not
          have one. Two rules remove that restriction, and between them they cover every case.

          **The law of sines** relates each side to the sine of the angle opposite it:

          $$\frac{a}{\sin A} = \frac{b}{\sin B} = \frac{c}{\sin C}$$

          **The law of cosines** handles the cases the sine rule cannot:

          $$c^2 = a^2 + b^2 - 2ab\cos C$$
      - type: callout
        variant: tip
        title: Which rule do I use?
        text: >-
          Look at what you are given. If you have an angle *paired with the side opposite it*,
          use the law of sines. If you have two sides and the angle *between* them, or all three
          sides, use the law of cosines. That single check settles almost every problem.
      - type: table
        headers: ["What you know", "Rule to use", "What you can find"]
        rows:
          - ["Two angles and any side", "Sines", "The other sides"]
          - ["Two sides and a non-included angle", "Sines", "The other angle (watch for two solutions)"]
          - ["Two sides and the included angle", "Cosines", "The third side"]
          - ["All three sides", "Cosines", "Any angle"]
      - type: example
        title: Across the river
        steps:
          - text: "Mark points A and B on your bank, 50 m apart. Call the tree on the far bank C."
          - text: "Measure the angle at A to the tree: 68°. Measure the angle at B: 74°."
          - text: "The third angle follows, since angles in a triangle sum to 180°."
            math: "C = 180° - 68° - 74° = 38°"
          - text: "Now the side AB = 50 m is opposite angle C, so the sine rule applies."
            math: "\\frac{AC}{\\sin 74°} = \\frac{50}{\\sin 38°}"
          - text: "Solving gives AC ≈ 78.1 m — the straight-line distance to the tree, never having left your bank."
      - type: example
        title: When the sine rule will not help
        steps:
          - text: "Two roads leave a junction at 110° to each other. You drive 8 km along one and 5 km along the other."
          - text: "You know two sides and the angle between them — no side is paired with a known opposite angle."
          - text: "Apply the law of cosines."
            math: "d^2 = 8^2 + 5^2 - 2(8)(5)\\cos 110°"
          - text: "cos 110° = −0.342, so the term subtracts a negative and increases the total."
            math: "d^2 = 64 + 25 + 27.4 = 116.4"
          - text: "d ≈ 10.8 km apart."
      - type: callout
        variant: note
        title: Pythagoras is a special case
        text: >-
          Set C = 90° in the law of cosines. Then cos C = 0, the last term vanishes, and it
          reduces to c² = a² + b². Pythagoras' theorem is the law of cosines for right triangles
          — not a separate result.
      - type: callout
        variant: warning
        title: The ambiguous case
        text: >-
          Given two sides and a non-included angle, there can be *two* different triangles that
          fit. Your calculator returns only the acute angle from arcsin; the obtuse angle
          180° − θ may also be valid. Always check whether the second solution makes geometric
          sense before discarding it.
      - type: practice
        skill: math-10-law-of-cosines
      - type: summary
        points:
          - The law of sines pairs each side with the angle opposite it
          - The law of cosines handles two sides plus the included angle, or all three sides
          - Choose the rule by checking whether you have a side-angle pair
          - Pythagoras is the law of cosines with the angle set to 90 degrees

  - slug: lesson-math-10-optimisation
    title: The Largest Field for the Least Fence
    topic: math-10-quadratic-applications
    skill: math-10-quadratic-optimisation
    estimated_minutes: 20
    summary: Every parabola has one highest or lowest point, and that is what makes it useful.
    objectives:
      - Translate a worded constraint into a quadratic function
      - Locate the vertex and interpret it as a maximum or minimum
      - Check that an optimal answer makes sense in context
    attribution: Written for HieuTrienEducation. Quadratic modelling informed by OpenStax Algebra and Trigonometry 2e (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          A farmer has 100 m of fencing and wants to enclose a rectangular field. What shape
          should it be?

          A long thin strip 49 m × 1 m uses all the fence and encloses 49 m². A 40 m × 10 m
          rectangle uses the same fence and encloses 400 m². Somewhere there is a best answer,
          and a quadratic finds it exactly.
      - type: text
        markdown: |
          ### Setting it up

          Call one side $x$. The perimeter fixes the other: $2x + 2y = 100$, so $y = 50 - x$.

          The area is what we want to maximise:

          $$A(x) = x(50 - x) = 50x - x^2$$

          This is a quadratic with a negative $x^2$ coefficient, so its graph is a downward
          parabola — it has a single maximum, at the vertex.
      - type: interactive
        widget: function-plot
        config:
          functions:
            - {expression: "50*x - x*x", label: "A = 50x − x²", color: "primary"}
            - {expression: "625", label: "Maximum area = 625", color: "muted"}
          xRange: [0, 50]
          yRange: [0, 700]
          axisLabels: {x: "side length x (m)", y: "area (m²)"}
      - type: example
        title: Finding the vertex
        steps:
          - text: "For A(x) = −x² + 50x, read off a = −1 and b = 50."
          - text: "The axis of symmetry sits at:"
            math: "x = -\\frac{b}{2a} = -\\frac{50}{-2} = 25"
          - text: "So one side is 25 m, and the other is 50 − 25 = 25 m. The optimal rectangle is a square."
          - text: "Maximum area:"
            math: "A = 25 \\times 25 = 625\\text{ m}^2"
      - type: callout
        variant: note
        title: A result worth remembering
        text: >-
          For a fixed perimeter, the rectangle of greatest area is always a square. It is the
          reason a circle beats every polygon for a given boundary length, and the reason a soap
          bubble is spherical.
      - type: table
        headers: ["x (m)", "y = 50 − x", "Area (m²)"]
        rows:
          - ["5", "45", "225"]
          - ["15", "35", "525"]
          - ["25", "25", "625"]
          - ["35", "15", "525"]
          - ["45", "5", "225"]
      - type: text
        markdown: |
          Notice the symmetry in the table: x = 15 and x = 35 give the same area. That is the
          parabola's axis of symmetry showing up in the arithmetic, and it is a useful check —
          if two different inputs give the same output, the vertex lies exactly between them.
      - type: callout
        variant: warning
        title: Always check the context
        text: >-
          The algebra is happy with x = 60, giving a negative "area". Geometry is not: x must
          lie between 0 and 50 for the field to exist. An optimisation answer outside the
          sensible domain means the true optimum sits at an endpoint instead.
      - type: practice
        skill: math-10-quadratic-optimisation
      - type: summary
        points:
          - Use the constraint to write the quantity as a function of one variable
          - A quadratic has one turning point, at x = −b/2a
          - A negative x² coefficient gives a maximum; a positive one gives a minimum
          - Check the answer lies within the domain the situation allows

  - slug: lesson-math-10-spread
    title: Two Classes, One Average, Very Different Stories
    topic: math-10-statistics-probability
    skill: math-10-spread-measures
    estimated_minutes: 20
    summary: The mean tells you where the data sits. It tells you nothing about how spread out it is.
    objectives:
      - Calculate variance and standard deviation
      - Interpret standard deviation as a typical distance from the mean
      - Compare two data sets with the same mean but different spread
    attribution: Written for HieuTrienEducation. Statistical treatment informed by OpenStax Introductory Statistics 2e (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          Two classes sit the same test. Both have a mean of 60.

          **Class A:** 58, 59, 60, 61, 62
          **Class B:** 20, 40, 60, 80, 100

          Identical averages. Completely different situations — and a teacher who only sees the
          mean would treat them the same way, which would be a mistake in both cases.
      - type: text
        markdown: |
          ### Measuring the spread

          The obvious idea is to average the distances from the mean. But those distances sum to
          zero by construction — the positives and negatives cancel exactly.

          The fix is to square them first. That removes the signs, and gives the **variance**:

          $$\sigma^2 = \frac{\sum (x_i - \bar{x})^2}{n}$$

          Squaring changes the units, though — square marks are meaningless. So take the square
          root, and you have the **standard deviation** σ, back in the original units.
      - type: example
        title: Class A
        steps:
          - text: "Mean is 60. The deviations are −2, −1, 0, 1, 2."
          - text: "Square them: 4, 1, 0, 1, 4. Their sum is 10."
          - text: "Variance:"
            math: "\\sigma^2 = \\frac{10}{5} = 2"
          - text: "Standard deviation:"
            math: "\\sigma = \\sqrt{2} \\approx 1.4\\text{ marks}"
      - type: example
        title: Class B
        steps:
          - text: "Mean is 60. The deviations are −40, −20, 0, 20, 40."
          - text: "Square them: 1600, 400, 0, 400, 1600. Their sum is 4000."
          - text: "Variance:"
            math: "\\sigma^2 = \\frac{4000}{5} = 800"
          - text: "Standard deviation:"
            math: "\\sigma = \\sqrt{800} \\approx 28.3\\text{ marks}"
      - type: table
        headers: ["", "Class A", "Class B"]
        rows:
          - ["Mean", "60", "60"]
          - ["Range", "4", "80"]
          - ["Standard deviation", "1.4", "28.3"]
          - ["What it means", "Everyone is at the same level", "Some are lost, some are far ahead"]
      - type: callout
        variant: tip
        title: What the number means
        text: >-
          Read the standard deviation as "a typical distance from the mean". Class A students
          sit about 1.4 marks from 60. Class B students sit about 28 marks away — the mean
          describes almost nobody in that class.
      - type: callout
        variant: note
        title: Why not just use the range?
        text: >-
          The range uses only two values and is destroyed by a single outlier. Standard
          deviation uses every value, so it describes the whole data set rather than its
          extremes.
      - type: callout
        variant: warning
        title: Two divisors
        text: >-
          Dividing by n gives the *population* standard deviation, used when your data is the
          entire group. Dividing by n − 1 gives the *sample* version, used when your data is a
          sample from a larger population. Check which one a question wants — they differ
          noticeably for small n.
      - type: practice
        skill: math-10-spread-measures
      - type: summary
        points:
          - Deviations from the mean sum to zero, so they are squared before averaging
          - Variance is the mean squared deviation; standard deviation is its square root
          - Standard deviation is a typical distance from the mean, in the original units
          - Two data sets can share a mean and be completely different

