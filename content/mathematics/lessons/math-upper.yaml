  - slug: lesson-math-11-radians
    title: Why Mathematicians Abandoned the Degree
    topic: math-11-trig-functions
    skill: math-11-radians
    estimated_minutes: 20
    summary: 360 is an arbitrary number inherited from Babylon. Radians are not arbitrary at all.
    objectives:
      - Convert between degrees and radians
      - Define the radian in terms of arc length
      - Read trigonometric values off the unit circle
    attribution: Written for HieuTrienEducation. Informed by OpenStax Precalculus 2e (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          Why are there 360 degrees in a circle?

          Because Babylonian astronomers counted in base 60 and reckoned a year at roughly 360
          days. That is the entire reason. There is nothing about a circle that singles out 360
          — we could as easily have inherited 100, or 400.

          A radian, by contrast, comes from the circle itself.
      - type: callout
        variant: note
        title: The definition
        text: >-
          One radian is the angle you get when the arc length equals the radius. Wrap the radius
          along the circumference; the angle it subtends at the centre is one radian. No
          convention, no history — just the shape.
      - type: text
        markdown: |
          ### How many fit in a circle?

          The full circumference is $2\pi r$. Each radian uses up an arc of length $r$. So a
          complete turn is $2\pi$ radians — about 6.28 of them.

          $$180° = \pi \text{ rad} \qquad 1\text{ rad} = \frac{180°}{\pi} \approx 57.3°$$

          To convert, multiply by $\pi/180$ going into radians, and by $180/\pi$ coming out.
      - type: table
        headers: ["Degrees", "Radians", "As a decimal"]
        rows:
          - ["30°", "π/6", "0.524"]
          - ["45°", "π/4", "0.785"]
          - ["60°", "π/3", "1.047"]
          - ["90°", "π/2", "1.571"]
          - ["180°", "π", "3.142"]
          - ["360°", "2π", "6.283"]
      - type: text
        markdown: |
          ### Why bother

          Radians are not merely a tidier convention. They make the formulas simpler because the
          angle is now a genuine ratio of two lengths rather than a count of arbitrary units.

          Arc length becomes just $s = r\theta$. Sector area becomes $A = \tfrac{1}{2}r^2\theta$.
          Both would need a clumsy $\pi/180$ factor in degrees.

          And critically for grade 12: the derivative of $\sin x$ is $\cos x$ **only when x is
          in radians**. In degrees you would be stuck writing $\frac{\pi}{180}\cos x$ forever.
      - type: example
        title: Arc length and sector area
        steps:
          - text: "A circle of radius 8 cm has a sector of angle 50°. Convert first."
            math: "\\theta = 50 \\times \\frac{\\pi}{180} = 0.873\\text{ rad}"
          - text: "Arc length:"
            math: "s = r\\theta = 8 \\times 0.873 = 6.98\\text{ cm}"
          - text: "Sector area:"
            math: "A = \\tfrac{1}{2}r^2\\theta = 0.5 \\times 64 \\times 0.873 = 27.9\\text{ cm}^2"
      - type: callout
        variant: tip
        title: The unit circle
        text: >-
          Draw a circle of radius 1. A point at angle θ around it has coordinates (cos θ, sin θ).
          That is not a coincidence — it is the definition, and it extends sine and cosine
          smoothly beyond the 0–90° range a right triangle allows.
      - type: callout
        variant: warning
        title: Check your calculator
        text: >-
          A calculator in the wrong mode gives confidently wrong answers with no warning.
          sin(30) is 0.5 in degrees and −0.988 in radians. Look for DEG or RAD on the display
          before you start.
      - type: practice
        skill: math-11-radians
      - type: summary
        points:
          - One radian is the angle whose arc length equals the radius
          - A full turn is 2π radians, and 180° = π radians
          - Arc length is rθ and sector area is half r squared θ, only in radians
          - Calculus formulas for sine and cosine require radians

  - slug: lesson-math-11-compound-growth
    title: The Most Powerful Force Is Multiplication
    topic: math-11-geometric
    skill: math-11-compound-growth
    estimated_minutes: 20
    summary: Repeated multiplication outruns intuition, and it explains savings, debt and epidemics alike.
    objectives:
      - Model growth with a geometric progression
      - Compare compound growth with linear growth
      - Solve for the time or rate using logarithms
    attribution: Written for HieuTrienEducation. Informed by OpenStax Algebra and Trigonometry 2e (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          A classic puzzle. A pond has one lily pad. Every day the number doubles. On day 30 the
          pond is completely covered.

          On which day was it half covered?

          The answer is day 29 — and almost nobody says it first time. Doubling means the last
          step is as large as everything before it combined. Human intuition is built for adding,
          not multiplying.
      - type: text
        markdown: |
          ### Adding versus multiplying

          **Arithmetic** growth adds a fixed amount each step: 100, 110, 120, 130 …
          **Geometric** growth multiplies by a fixed factor: 100, 110, 121, 133.1 …

          They look nearly identical at first. Over time they diverge completely, because the
          geometric one earns growth on its previous growth.

          $$u_n = a r^{\,n-1}$$
      - type: interactive
        widget: function-plot
        config:
          functions:
            - {expression: "100*1.07**x", label: "7% compound", color: "primary"}
            - {expression: "100 + 7*x", label: "7 per year, simple", color: "accent"}
          xRange: [0, 40]
          yRange: [0, 1200]
          axisLabels: {x: "years", y: "value"}
      - type: example
        title: A savings account
        steps:
          - text: "100 million dong is deposited at 7% compounded annually."
          - text: "Each year multiplies the balance by 1.07."
            math: "V_n = 100 \\times 1.07^{\\,n}"
          - text: "After 10 years:"
            math: "V = 100 \\times 1.07^{10} = 196.7\\text{ million}"
          - text: "After 30 years:"
            math: "V = 100 \\times 1.07^{30} = 761.2\\text{ million}"
          - text: "Simple interest at 7 million a year would have given only 310 million over the same 30 years."
      - type: callout
        variant: tip
        title: The rule of 72
        text: >-
          Divide 72 by the percentage growth rate and you get the approximate doubling time. At
          7%, money doubles in roughly 72 ÷ 7 ≈ 10 years — which matches the calculation above
          almost exactly. It is a good enough estimate to do in your head.
      - type: text
        markdown: |
          ### Solving for time

          If the unknown is in the exponent, logarithms are the tool that brings it down:

          $$100 \times 1.07^{\,n} = 500 \;\Rightarrow\; 1.07^{\,n} = 5 \;\Rightarrow\; n = \frac{\ln 5}{\ln 1.07} \approx 23.8\text{ years}$$
      - type: table
        headers: ["Situation", "Ratio r", "Behaviour"]
        rows:
          - ["Savings at 7%", "1.07", "Grows, doubling about every 10 years"]
          - ["Credit card debt at 2% monthly", "1.02 monthly", "Grows 27% a year if unpaid"]
          - ["Radioactive decay", "0.5 per half-life", "Shrinks towards zero"]
          - ["Depreciating car at 15%/year", "0.85", "Loses over half its value in 5 years"]
      - type: callout
        variant: warning
        title: It works against you too
        text: >-
          Compounding is not a benefit — it is a mechanism, and debt uses it as readily as
          savings. A credit card at 2% per month is not 24% a year; it is 1.02¹² − 1 ≈ 26.8%,
          and it compounds on the interest already owed.
      - type: practice
        skill: math-11-compound-growth
      - type: summary
        points:
          - Geometric growth multiplies by a fixed ratio each step
          - The nth term is a r to the power n minus 1
          - Compounding diverges sharply from simple growth over long periods
          - Use logarithms when the unknown is in the exponent

  - slug: lesson-math-11-derivative
    title: How Fast Are You Going Right Now?
    topic: math-11-derivatives
    skill: math-11-derivative-definition
    estimated_minutes: 24
    summary: Speed at an instant, from a calculation that only knows how to handle intervals.
    objectives:
      - Define the derivative as the limit of a difference quotient
      - Interpret the derivative as an instantaneous rate of change
      - Connect the gradient of a chord to the gradient of a tangent
    attribution: Written for HieuTrienEducation. Informed by OpenStax Calculus Volume 1 (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          Your speedometer says 60 km/h. What does that actually mean?

          Speed is distance divided by time. But *right now* is an instant — zero time has
          elapsed, and you have covered zero distance. The calculation is 0 ÷ 0, which is not a
          number.

          And yet the speedometer is clearly telling you something true. Resolving that tension
          is what calculus was invented for.
      - type: text
        markdown: |
          ### Squeezing the interval

          You cannot measure speed over zero time. But you can measure it over a *small* time,
          and then keep shrinking the interval.

          Take a journey where distance is $s(t) = t^2$ metres. What is the speed at exactly
          t = 3 s?
      - type: table
        headers: ["Interval", "Distance covered", "Average speed"]
        rows:
          - ["3 → 4 s", "16 − 9 = 7 m", "7.0 m/s"]
          - ["3 → 3.1 s", "9.61 − 9 = 0.61 m", "6.1 m/s"]
          - ["3 → 3.01 s", "9.0601 − 9 = 0.0601 m", "6.01 m/s"]
          - ["3 → 3.001 s", "0.006001 m", "6.001 m/s"]
      - type: callout
        variant: note
        title: The pattern
        text: >-
          The averages are converging on 6 m/s. We never actually reach a zero interval — but
          the values approach 6 as closely as we like. That limiting value *is* the instantaneous
          speed. This is the whole idea.
      - type: text
        markdown: |
          ### Writing it down

          For a general function, take an interval of width $h$ starting at $x$:

          $$\text{average rate} = \frac{f(x+h) - f(x)}{h}$$

          This is the gradient of the **chord** joining two points on the curve. Now let $h$
          shrink towards zero. The chord pivots until it becomes the **tangent**:

          $$f'(x) = \lim_{h \to 0} \frac{f(x+h) - f(x)}{h}$$
      - type: example
        title: Deriving it for f(x) = x²
        steps:
          - text: "Write out the difference quotient."
            math: "\\frac{(x+h)^2 - x^2}{h}"
          - text: "Expand the numerator."
            math: "= \\frac{x^2 + 2xh + h^2 - x^2}{h} = \\frac{2xh + h^2}{h}"
          - text: "Every term has an h, so it cancels — and this is the step that rescues us from 0/0."
            math: "= 2x + h"
          - text: "Now let h approach 0."
            math: "f'(x) = 2x"
          - text: "At x = 3 this gives 6 — exactly the value the table was converging on."
      - type: interactive
        widget: function-plot
        config:
          functions:
            - {expression: "x*x", label: "f(x) = x²", color: "primary"}
            - {expression: "6*x - 9", label: "tangent at x = 3, gradient 6", color: "accent"}
          xRange: [-1, 6]
          yRange: [-10, 30]
          axisLabels: {x: "x", y: "y"}
      - type: callout
        variant: tip
        title: One idea, many names
        text: >-
          Gradient of a tangent, instantaneous rate of change, marginal cost, velocity from a
          distance-time graph, current from a charge-time graph — all of these are the
          derivative. Recognising that they are the same object is most of what grade 12 asks of
          you.
      - type: callout
        variant: warning
        title: The limit is not "substitute h = 0"
        text: >-
          You cannot set h = 0 in the difference quotient — that gives 0/0 again. You must
          simplify algebraically first, cancelling the h, and only then take the limit. Skipping
          the cancellation is the most common error in this topic.
      - type: practice
        skill: math-11-derivative-definition
      - type: summary
        points:
          - Average rate of change is the gradient of a chord
          - The derivative is the limit of that gradient as the interval shrinks to zero
          - Geometrically it is the gradient of the tangent at a point
          - Cancel the h algebraically before taking the limit

