# Mathematics — Grade 12 question templates
defaults:
  license: proprietary
  source: HieuTrienEducation
  status: published

questions:
  - slug: m12-critical-point
    skill: math-12-monotonicity
    type: numeric
    difficulty: 5
    prompt: >-
      Find the x-coordinate of the stationary point of f(x) = {{a}}x^2 + {{b}}x + {{c}}.
    variables:
      a: {type: int, min: 1, max: 8}
      b: {type: int, min: -20, max: 20}
      c: {type: int, min: -10, max: 10}
    constraints: ["b != 0"]
    answer: {expression: "-b / (2 * a)", decimals: 4, tolerance: 0.005}
    options:
      distractors: ["b / (2 * a)", "-b / a"]
    hints:
      - text: "A stationary point is where f'(x) = 0."
      - text: "f'(x) = {{2*a}}x + {{b}}."
    solution:
      - text: "f'(x) = {{2*a}}x + {{b}} = 0."
      - text: "x = -({{b}}) ÷ {{2*a}} = {{-b / (2 * a) : 4}}."
      - text: "Since a = {{a}} > 0, f decreases before this point and increases after it — a minimum."

  - slug: m12-max-on-interval
    skill: math-12-extrema
    type: numeric
    difficulty: 5
    prompt: >-
      Find the greatest value of f(x) = {{a}} - (x - {{h}})^2 on the interval
      from {{h}} - {{d}} to {{h}} + {{d}}.
    variables:
      a: {type: int, min: 5, max: 60}
      h: {type: int, min: -6, max: 6}
      d: {type: int, min: 1, max: 6}
    answer: {expression: "a"}
    options:
      distractors: ["a - d * d", "a + d * d"]
    hints:
      - text: "This is a downward parabola with its vertex at x = {{h}}."
      - text: "The vertex lies inside the interval, so the maximum is there."
    solution:
      - text: "f'(x) = -2(x - {{h}}), which is zero at x = {{h}}."
      - text: "That point is inside the interval, and the parabola opens downwards."
      - text: "f({{h}}) = {{a}} - 0 = {{a}}, the greatest value."

  - slug: m12-horizontal-asymptote
    skill: math-12-asymptotes
    type: numeric
    difficulty: 5
    prompt: >-
      What is the horizontal asymptote of y = ({{a}}x + {{b}}) / ({{c}}x + {{d}})?
      Give the y-value.
    variables:
      a: {type: int, min: 1, max: 12}
      b: {type: int, min: -10, max: 10}
      c: {type: int, min: 1, max: 8}
      d: {type: int, min: -10, max: 10}
    answer: {expression: "a / c", decimals: 4, tolerance: 0.005}
    options:
      distractors: ["b / d", "c / a"]
    hints:
      - text: "For large x, the constant terms stop mattering."
      - text: "The ratio approaches the ratio of the leading coefficients."
    solution:
      - text: "Divide numerator and denominator by x: ({{a}} + {{b}}/x) / ({{c}} + {{d}}/x)."
      - text: "As x grows, the {{b}}/x and {{d}}/x terms vanish."
      - text: "y approaches {{a}} ÷ {{c}} = {{a / c : 4}}."

  - slug: m12-optimisation-box
    skill: math-12-optimisation
    type: numeric
    difficulty: 5
    prompt: >-
      An open-topped box with a square base must hold {{v}} cm^3.
      What base side length, in centimetres, uses the least material?
    variables:
      v: {type: int, min: 100, max: 8000, step: 100}
    answer:
      expression: "(2 * v) ** (1 / 3)"
      unit: "cm"
      decimals: 3
      tolerance: 0.005
    options:
      distractors: ["v ** (1 / 3)", "(4 * v) ** (1 / 3)"]
    hints:
      - text: "With base x and height h, the volume gives h = {{v}}/x^2."
      - text: "The surface area is A = x^2 + 4xh = x^2 + 4({{v}})/x. Set dA/dx = 0."
    solution:
      - text: "A(x) = x^2 + 4({{v}})/x."
      - text: "A'(x) = 2x - 4({{v}})/x^2 = 0, so x^3 = 2({{v}}) = {{2 * v}}."
      - text: "x = {{(2 * v) ** (1 / 3) : 3}} cm."

  - slug: m12-space-distance
    skill: math-12-space-distance
    type: numeric
    difficulty: 4
    prompt: >-
      Find the distance between the points ({{x1}}, {{y1}}, {{z1}}) and ({{x2}}, {{y2}}, {{z2}}).
    variables:
      x1: {type: int, min: -9, max: 9}
      y1: {type: int, min: -9, max: 9}
      z1: {type: int, min: -9, max: 9}
      x2: {type: int, min: -9, max: 9}
      y2: {type: int, min: -9, max: 9}
      z2: {type: int, min: -9, max: 9}
    constraints: ["x1 != x2 or y1 != y2 or z1 != z2"]
    answer:
      expression: "sqrt((x2-x1)**2 + (y2-y1)**2 + (z2-z1)**2)"
      decimals: 4
      tolerance: 0.005
    options:
      distractors: ["abs(x2-x1) + abs(y2-y1) + abs(z2-z1)", "(x2-x1)**2 + (y2-y1)**2 + (z2-z1)**2"]
    hints:
      - text: "It is Pythagoras with one more term."
      - text: "The differences are {{x2-x1}}, {{y2-y1}} and {{z2-z1}}."
    solution:
      - text: "d = sqrt({{(x2-x1)**2}} + {{(y2-y1)**2}} + {{(z2-z1)**2}})."
      - text: "d = {{sqrt((x2-x1)**2 + (y2-y1)**2 + (z2-z1)**2) : 4}}."

  - slug: m12-dot-product-3d
    skill: math-12-space-vector-ops
    type: numeric
    difficulty: 4
    prompt: >-
      Find the dot product of ({{a}}, {{b}}, {{c}}) and ({{d}}, {{e}}, {{f}}).
    variables:
      a: {type: int, min: -8, max: 8}
      b: {type: int, min: -8, max: 8}
      c: {type: int, min: -8, max: 8}
      d: {type: int, min: -8, max: 8}
      e: {type: int, min: -8, max: 8}
      f: {type: int, min: -8, max: 8}
    answer: {expression: "a*d + b*e + c*f"}
    options:
      distractors: ["a*d - b*e - c*f", "(a+b+c) * (d+e+f)"]
    hints:
      - text: "Multiply matching components and add all three products."
    solution:
      - text: "= ({{a}})({{d}}) + ({{b}})({{e}}) + ({{c}})({{f}})"
      - text: "= {{a*d}} + {{b*e}} + {{c*f}} = {{a*d + b*e + c*f}}."

  - slug: m12-point-to-plane
    skill: math-12-plane-equation
    type: numeric
    difficulty: 5
    prompt: >-
      Find the distance from the point ({{px}}, {{py}}, {{pz}}) to the plane
      {{a}}x + {{b}}y + {{c}}z + {{d}} = 0.
    variables:
      a: {type: int, min: -6, max: 6}
      b: {type: int, min: -6, max: 6}
      c: {type: int, min: -6, max: 6}
      d: {type: int, min: -10, max: 10}
      px: {type: int, min: -8, max: 8}
      py: {type: int, min: -8, max: 8}
      pz: {type: int, min: -8, max: 8}
    constraints: ["a != 0 or b != 0 or c != 0"]
    answer:
      expression: "abs(a*px + b*py + c*pz + d) / sqrt(a*a + b*b + c*c)"
      decimals: 4
      tolerance: 0.005
    options:
      distractors: ["abs(a*px + b*py + c*pz + d)", "(a*px + b*py + c*pz + d) / (a + b + c)"]
    hints:
      - text: "Distance = |a x0 + b y0 + c z0 + d| ÷ sqrt(a^2 + b^2 + c^2)."
      - text: "The numerator is |{{a*px + b*py + c*pz + d}}|."
    solution:
      - text: "Numerator = |{{a}}({{px}}) + {{b}}({{py}}) + {{c}}({{pz}}) + {{d}}| = {{abs(a*px + b*py + c*pz + d)}}."
      - text: "Denominator = sqrt({{a*a + b*b + c*c}}) = {{sqrt(a*a + b*b + c*c) : 4}}."
      - text: "Distance = {{abs(a*px + b*py + c*pz + d) / sqrt(a*a + b*b + c*c) : 4}}."

  - slug: m12-sphere-radius
    skill: math-12-sphere-equation
    type: numeric
    difficulty: 4
    prompt: >-
      A sphere has the equation (x - {{a}})^2 + (y - {{b}})^2 + (z - {{c}})^2 = {{r2}}.
      What is its radius?
    variables:
      a: {type: int, min: -8, max: 8}
      b: {type: int, min: -8, max: 8}
      c: {type: int, min: -8, max: 8}
      r: {type: int, min: 2, max: 15}
      r2: {type: derived, expression: "r * r"}
    answer: {expression: "sqrt(r2)", decimals: 3, tolerance: 0.005}
    options:
      distractors: ["r2", "r2 / 2"]
    hints:
      - text: "In the standard form the right-hand side is the radius *squared*."
    solution:
      - text: "r^2 = {{r2}}, so r = {{sqrt(r2) : 3}}."
      - text: "The centre is at ({{a}}, {{b}}, {{c}})."

  - slug: m12-antiderivative-value
    skill: math-12-antiderivative
    type: numeric
    difficulty: 5
    prompt: >-
      F(x) is the antiderivative of f(x) = {{a}}x^2 + {{b}} with F(0) = 0.
      What is F({{p}})?
    variables:
      a: {type: int, min: 1, max: 9}
      b: {type: int, min: -10, max: 10}
      p: {type: int, min: 1, max: 6}
    answer: {expression: "a * p ** 3 / 3 + b * p", decimals: 4, tolerance: 0.005}
    options:
      distractors: ["a * p ** 3 + b * p", "2 * a * p + b"]
    hints:
      - text: "Integrate term by term: the antiderivative of x^n is x^(n+1)/(n+1)."
      - text: "F(x) = {{a}}x^3/3 + {{b}}x + C, and F(0) = 0 makes C = 0."
    solution:
      - text: "F(x) = {{a}}x^3/3 + {{b}}x."
      - text: "F({{p}}) = {{a}}({{p ** 3}})/3 + {{b}}({{p}}) = {{a * p ** 3 / 3 + b * p : 4}}."

  - slug: m12-definite-integral
    skill: math-12-definite-integral
    type: numeric
    difficulty: 5
    prompt: >-
      Evaluate the definite integral of {{a}}x + {{b}} from x = 0 to x = {{p}}.
    variables:
      a: {type: int, min: 1, max: 10}
      b: {type: int, min: -8, max: 12}
      p: {type: int, min: 1, max: 9}
    answer: {expression: "a * p * p / 2 + b * p", decimals: 3, tolerance: 0.005}
    options:
      distractors: ["a * p + b", "a * p * p + b * p"]
    hints:
      - text: "The antiderivative is {{a}}x^2/2 + {{b}}x."
      - text: "Evaluate at {{p}} and subtract the value at 0 (which is 0)."
    solution:
      - text: "F(x) = {{a}}x^2/2 + {{b}}x."
      - text: "F({{p}}) - F(0) = {{a}}({{p*p}})/2 + {{b}}({{p}}) = {{a * p * p / 2 + b * p : 3}}."

  - slug: m12-area-between-curves
    skill: math-12-area-volume
    type: numeric
    difficulty: 5
    prompt: >-
      Find the area enclosed between y = {{k}}x and y = x^2, where {{k}} > 0.
    variables:
      k: {type: int, min: 2, max: 12}
    answer: {expression: "k ** 3 / 6", decimals: 4, tolerance: 0.005}
    options:
      distractors: ["k ** 3 / 3", "k * k / 2"]
    hints:
      - text: "The curves meet where {{k}}x = x^2, that is at x = 0 and x = {{k}}."
      - text: "Integrate the difference ({{k}}x - x^2) between those limits."
    solution:
      - text: "Intersections at x = 0 and x = {{k}}."
      - text: "Area = integral of ({{k}}x - x^2) = [{{k}}x^2/2 - x^3/3] from 0 to {{k}}."
      - text: "= {{k ** 3 / 2 : 4}} - {{k ** 3 / 3 : 4}} = {{k ** 3 / 6 : 4}}."

  - slug: m12-grouped-mean
    skill: math-12-grouped-mean
    type: numeric
    difficulty: 4
    prompt: >-
      A frequency table has midpoints {{m1}}, {{m2}} and {{m3}} with frequencies
      {{f1}}, {{f2}} and {{f3}}. Estimate the mean.
    variables:
      m1: {type: int, min: 5, max: 20}
      m2: {type: int, min: 25, max: 40}
      m3: {type: int, min: 45, max: 70}
      f1: {type: int, min: 2, max: 25}
      f2: {type: int, min: 2, max: 25}
      f3: {type: int, min: 2, max: 25}
    answer:
      expression: "(m1*f1 + m2*f2 + m3*f3) / (f1 + f2 + f3)"
      decimals: 3
      tolerance: 0.005
    options:
      distractors: ["(m1 + m2 + m3) / 3", "(m1*f1 + m2*f2 + m3*f3) / 3"]
    hints:
      - text: "Multiply each midpoint by its frequency, add, then divide by the total frequency."
      - text: "Total frequency = {{f1 + f2 + f3}}."
    solution:
      - text: "Sum of (midpoint x frequency) = {{m1*f1 + m2*f2 + m3*f3}}."
      - text: "Total frequency = {{f1 + f2 + f3}}."
      - text: "Mean = {{(m1*f1 + m2*f2 + m3*f3) / (f1 + f2 + f3) : 3}}. It is an *estimate* — the raw values inside each class are gone."

  - slug: m12-grouped-variance
    skill: math-12-grouped-spread
    type: numeric
    difficulty: 5
    prompt: >-
      Two midpoints {{m1}} and {{m2}} occur with frequencies {{f1}} and {{f2}}.
      Estimate the standard deviation.
    variables:
      m1: {type: int, min: 2, max: 30}
      m2: {type: int, min: 35, max: 80}
      f1: {type: int, min: 1, max: 20}
      f2: {type: int, min: 1, max: 20}
    answer:
      expression: >-
        sqrt((f1 * (m1 - (m1*f1 + m2*f2)/(f1+f2))**2
        + f2 * (m2 - (m1*f1 + m2*f2)/(f1+f2))**2) / (f1 + f2))
      decimals: 4
      tolerance: 0.005
    options:
      distractors: ["(m2 - m1) / 2", "(m1*f1 + m2*f2) / (f1 + f2)"]
    hints:
      - text: "Find the mean first: {{(m1*f1 + m2*f2)/(f1+f2) : 3}}."
      - text: "Then take the frequency-weighted average of the squared deviations, and its square root."
    solution:
      - text: "Mean = {{(m1*f1 + m2*f2)/(f1+f2) : 3}}."
      - text: "Weighted mean of squared deviations gives the variance."
      - text: "Standard deviation = {{sqrt((f1 * (m1 - (m1*f1 + m2*f2)/(f1+f2))**2 + f2 * (m2 - (m1*f1 + m2*f2)/(f1+f2))**2) / (f1 + f2)) : 4}}."

  - slug: m12-conditional-probability
    skill: math-12-conditional-probability
    type: numeric
    difficulty: 5
    prompt: >-
      In a group, {{ab}} people out of {{n}} own both a bicycle and a motorbike, and
      {{b}} own a motorbike. Given that a randomly chosen person owns a motorbike,
      what is the probability they also own a bicycle? Give a decimal.
    variables:
      n: {type: int, min: 40, max: 300, step: 10}
      b: {type: int, min: 10, max: 120, step: 5}
      ab: {type: int, min: 2, max: 60}
    constraints: ["ab < b", "b < n"]
    answer: {expression: "ab / b", decimals: 4, tolerance: 0.005}
    options:
      distractors: ["ab / n", "b / n"]
    hints:
      - text: "P(A given B) = P(A and B) / P(B)."
      - text: "Knowing they own a motorbike restricts the group to {{b}} people, not {{n}}."
    solution:
      - text: "The condition narrows the sample space to the {{b}} motorbike owners."
      - text: "Of those, {{ab}} also own a bicycle."
      - text: "P = {{ab}} ÷ {{b}} = {{ab / b : 4}}."

  - slug: m12-bayes-medical-test
    skill: math-12-bayes
    type: numeric
    difficulty: 5
    prompt: >-
      A disease affects {{prev}}% of a population. A test detects it in {{sens}}% of people who
      have it, but also returns positive for {{fpr}}% of people who do not. If someone tests
      positive, what is the probability they actually have the disease? Give a decimal.
    variables:
      prev: {type: choice, choices: [0.1, 0.5, 1, 2, 5]}
      sens: {type: choice, choices: [90, 95, 99]}
      fpr: {type: choice, choices: [1, 2, 5, 10]}
    answer:
      expression: >-
        (prev / 100 * sens / 100)
        / (prev / 100 * sens / 100 + (1 - prev / 100) * fpr / 100)
      decimals: 5
      tolerance: 0.005
    options:
      distractors: ["sens / 100", "1 - fpr / 100"]
    hints:
      - text: "Imagine 100000 people. How many are true positives, and how many false positives?"
      - text: "P(disease | positive) = true positives ÷ all positives."
    solution:
      - text: "True positives = {{prev / 100 * sens / 100 : 6}} of the population."
      - text: "False positives = {{(1 - prev / 100) * fpr / 100 : 6}} of the population."
      - text: "P = {{(prev / 100 * sens / 100) / (prev / 100 * sens / 100 + (1 - prev / 100) * fpr / 100) : 5}}."
      - text: "The answer is usually far lower than people expect: when a disease is rare, the healthy majority produces most of the positive results."
