# Vietnamese translations for the physics curriculum.
#
# Same mechanism as the mathematics file: keyed by entity kind then slug, merged into each row's
# `i18n` column by the loader and served when a request carries `X-Locale: vi`.
#
# Terminology follows the Vietnamese lower-secondary science curriculum (Khoa học tự nhiên /
# Vật lí THCS): khối lượng riêng, lực ma sát, công suất, hiệu điện thế, định luật Ôm, chu kì.

subjects:
  physics:
    name: Vật lý
    description: >-
      Thế giới vật chất vận hành như thế nào, từ phép đo và chuyển động đến năng lượng, điện và
      ánh sáng. Mỗi ý tưởng đều gắn với một đại lượng đo được và một công thức mà học sinh có
      thể tự kiểm chứng.

courses:
  physics-6:
    title: Vật lý — Lớp 6
    summary: Phép đo, chất và những ý niệm đầu tiên về lực và năng lượng.
    description: >-
      Lớp 6 bắt đầu từ điều cơ bản nhất của vật lý: đo được một đại lượng một cách tin cậy. Từ
      đó học sinh tìm hiểu khối lượng riêng, mô hình hạt của chất, các loại lực và những dạng
      năng lượng cơ bản.
  physics-7:
    title: Vật lý — Lớp 7
    summary: Chuyển động, áp suất, nhiệt và sự truyền ánh sáng.
    description: >-
      Lớp 7 mô tả chuyển động bằng lời, bằng số và bằng đồ thị, đồng thời nghiên cứu áp suất
      trong chất rắn và chất lỏng, sự truyền nhiệt và các hiện tượng phản xạ, khúc xạ ánh sáng.
  physics-8:
    title: Vật lý — Lớp 8
    summary: Các định luật Newton, công và công suất, điện học và sóng.
    description: >-
      Lớp 8 giới thiệu ba định luật Newton, cách tính công, công suất và hiệu suất, mạch điện
      với định luật Ôm, cùng các tính chất của sóng và âm thanh.
  physics-9:
    title: Vật lý — Lớp 9
    summary: Động lượng, tính toán nhiệt, điện từ học và cấu tạo nguyên tử.
    description: >-
      Lớp 9 hoàn thiện chương trình THCS với các công thức chuyển động biến đổi đều, định luật
      bảo toàn động lượng, nhiệt lượng và nhiệt nóng chảy, hiện tượng cảm ứng điện từ và vật lý
      hạt nhân.

units:
  physics-6-measurement:
    title: Phép đo
    summary: Vật lý bắt đầu từ việc đo được một đại lượng một cách tin cậy.
  physics-6-matter:
    title: Chất
    summary: Chất rắn, chất lỏng, chất khí và những gì xảy ra khi chuyển thể.
  physics-6-forces:
    title: Lực và chuyển động
    summary: Lực đẩy và lực kéo, cùng những tác dụng của chúng.
  physics-6-energy:
    title: Năng lượng
    summary: Đại lượng duy nhất kết nối mọi chủ đề khác trong vật lý.
  physics-7-motion:
    title: Chuyển động
    summary: Mô tả chuyển động bằng lời, bằng số và bằng đồ thị.
  physics-7-pressure:
    title: Áp suất
    summary: Lực phân bố trên một diện tích — trong chất rắn, chất lỏng và khí quyển.
  physics-7-heat:
    title: Nhiệt và nhiệt độ
    summary: Phân biệt một vật nóng đến mức nào với lượng năng lượng nó chứa.
  physics-7-light:
    title: Ánh sáng
    summary: Ánh sáng truyền đi, phản xạ và bị bẻ cong như thế nào.
  physics-8-newton:
    title: Lực và các định luật Newton
    summary: Ba phát biểu giải thích gần như toàn bộ chuyển động thường ngày.
  physics-8-work-energy:
    title: Công, năng lượng và công suất
    summary: Định lượng hoá các quá trình truyền năng lượng.
  physics-8-electricity:
    title: Điện học
    summary: Điện tích, cường độ dòng điện, hiệu điện thế và điện trở trong mạch.
  physics-8-waves:
    title: Sóng và âm thanh
    summary: Năng lượng lan truyền mà vật chất không chuyển dời theo.
  physics-9-motion-momentum:
    title: Chuyển động và động lượng
    summary: Các công thức chuyển động, và đại lượng được bảo toàn trong va chạm.
  physics-9-thermal:
    title: Nhiệt học
    summary: Tính toán quá trình nung nóng, làm nguội và chuyển thể.
  physics-9-electromagnetism:
    title: Điện từ học
    summary: Mối liên hệ sâu sắc giữa điện và từ.
  physics-9-atomic:
    title: Vật lý nguyên tử và hạt nhân
    summary: Bên trong nguyên tử, và điều gì khiến một hạt nhân không bền.

