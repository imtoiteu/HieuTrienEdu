  - slug: lesson-physics-12-hot-air-balloon
    title: Why a Hot-Air Balloon Rises
    topic: physics-12-gas-laws-adv
    skill: physics-12-ideal-gas-equation
    estimated_minutes: 22
    summary: One equation explains a balloon, a tyre on a hot day and a scuba tank.
    objectives:
      - Apply the ideal gas equation pV = nRT
      - Explain why heating air at constant pressure lowers its density
      - Use absolute temperature correctly in gas calculations
    attribution: Written for HieuTrienEducation. Gas law treatment informed by OpenStax University Physics Volume 2 (CC BY 4.0) and the PhET Gas Properties simulation.
    license: proprietary
    blocks:
      - type: text
        markdown: |
          A hot-air balloon carries several tonnes of basket, burner, fuel and passengers. It has
          no wings, no engine and no propeller. It rises because the air inside it is warm.

          That is the whole mechanism — and it follows from one equation.
      - type: math
        latex: "pV = nRT"
      - type: callout
        variant: warning
        title: T is always in kelvin
        text: >-
          This is the single most common error in gas calculations. Warming air from 20 °C to
          100 °C does not multiply the temperature by five — it goes from 293 K to 373 K, a
          factor of 1.27. Using Celsius here gives an answer that is not merely imprecise but
          meaningless, because the scale has an arbitrary zero.
      - type: text
        markdown: |
          ### Why heating makes air rise

          The envelope of a balloon is open at the bottom, so the pressure inside stays equal to
          the pressure outside. The volume is fixed by the fabric. So in $pV = nRT$, with $p$ and
          $V$ both held constant, raising $T$ must reduce $n$ — air is pushed out of the opening.

          Fewer molecules in the same volume means **lower density**. And a body less dense than
          the fluid around it experiences an upward resultant force.
      - type: example
        title: How much lift?
        steps:
          - text: "A balloon envelope holds 2800 m³. Outside air at 15 °C (288 K) has a density of about 1.23 kg/m³."
          - text: "Heat the inside air to 100 °C (373 K). Density scales inversely with absolute temperature at constant pressure:"
            math: "\\rho_{\\text{in}} = 1.23 \\times \\frac{288}{373} = 0.95\\text{ kg/m}^3"
          - text: "Mass of air displaced:"
            math: "m_{\\text{out}} = 1.23 \\times 2800 = 3444\\text{ kg}"
          - text: "Mass of air inside:"
            math: "m_{\\text{in}} = 0.95 \\times 2800 = 2660\\text{ kg}"
          - text: "The difference is the payload the balloon can lift — about 780 kg, including the envelope itself."
      - type: table
        headers: ["Situation", "Held constant", "What follows"]
        rows:
          - ["Hot-air balloon", "p and V", "Heating drives air out, density falls"]
          - ["Car tyre on a hot day", "V and n", "Heating raises the pressure"]
          - ["Scuba tank filled", "V and T", "More moles means more pressure"]
          - ["Syringe plunger pushed", "n and T", "Less volume means more pressure"]
      - type: callout
        variant: tip
        title: Reading the equation as a tool
        text: >-
          Almost every gas question is answered the same way: decide which quantities are held
          fixed, cancel them from both sides of pV = nRT, and the relationship you need is what
          is left. Boyle's law and Charles's law are not separate rules to memorise — they are
          this equation with something held constant.
      - type: callout
        variant: note
        title: Where "ideal" stops being true
        text: >-
          The equation assumes molecules have no volume and do not attract each other. Both
          assumptions hold well for air at everyday pressures. Near liquefaction — a gas under
          very high pressure or close to its boiling point — real gases deviate noticeably.
      - type: practice
        skill: physics-12-ideal-gas-equation
      - type: summary
        points:
          - pV = nRT relates pressure, volume, amount and absolute temperature
          - Temperature must always be in kelvin
          - Heating air at constant pressure and volume expels molecules, lowering density
          - A balloon rises because the air inside is less dense than the air outside

  - slug: lesson-physics-12-transformers
    title: The Reason Power Lines Run at 500,000 Volts
    topic: physics-12-induction-ac
    skill: physics-12-ac-transformers
    estimated_minutes: 22
    summary: Transmitting electricity at high voltage is not a design choice. It is arithmetic.
    objectives:
      - Apply the transformer turns-ratio equation
      - Explain why transmission losses fall as voltage rises
      - Describe why the grid uses alternating current
    attribution: Written for HieuTrienEducation. Electromagnetic induction treatment informed by OpenStax University Physics Volume 2 (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          The cables on a transmission tower carry electricity at hundreds of thousands of volts.
          The socket in your wall delivers 220 V. Somewhere in between, that voltage is stepped
          down — several times.

          Why go to all that trouble? Why not generate at 220 V and send it straight to houses?
      - type: text
        markdown: |
          ### The cost of carrying current

          Transmission cables have resistance. Power lost heating them is:

          $$P_{\text{lost}} = I^2 R$$

          Notice it depends on the **current squared**, and not on the voltage at all. Meanwhile
          the power actually delivered is $P = VI$.

          So for a fixed amount of power delivered, raising V lets you lower I proportionally —
          and the loss falls as the *square* of that reduction.
      - type: example
        title: The same 10 MW, two ways
        steps:
          - text: "Deliver 10 MW down a line of resistance 5 Ω at 10 kV."
            math: "I = \\frac{10^7}{10^4} = 1000\\text{ A} \\;\\Rightarrow\\; P_{\\text{lost}} = 1000^2 \\times 5 = 5\\text{ MW}"
          - text: "Half the power is wasted as heat in the cable. Now try 400 kV."
            math: "I = \\frac{10^7}{4\\times10^5} = 25\\text{ A} \\;\\Rightarrow\\; P_{\\text{lost}} = 25^2 \\times 5 = 3.1\\text{ kW}"
          - text: "The loss has fallen from 5 MW to about 3 kW — a factor of 1600, from a factor of 40 in voltage."
      - type: callout
        variant: note
        title: This is why the grid is AC
        text: >-
          A transformer works by electromagnetic induction, and induction requires a *changing*
          magnetic field. A steady direct current produces a steady field and induces nothing.
          Alternating current changes continuously, which is exactly what a transformer needs.
          The grid is AC because transformers only work on AC.
      - type: math
        latex: "\\frac{V_s}{V_p} = \\frac{N_s}{N_p}"
      - type: text
        markdown: |
          More turns on the secondary than the primary steps the voltage **up**; fewer steps it
          **down**. In an ideal transformer no power is lost, so stepping the voltage up
          necessarily steps the current down by the same factor:

          $$V_p I_p = V_s I_s$$
      - type: table
        headers: ["Stage", "Voltage", "Why"]
        rows:
          - ["Generator", "25 kV", "Set by the machine design"]
          - ["Step-up transformer", "500 kV", "Minimise I²R over long distances"]
          - ["Regional substation", "110 kV", "Shorter distances, safer handling"]
          - ["Local substation", "22 kV", "Distribution around a district"]
          - ["Street transformer", "220 V", "Safe for domestic use"]
      - type: callout
        variant: tip
        title: Where the energy actually goes
        text: >-
          A transformer does not create energy. It trades voltage against current at constant
          power. If you step voltage up tenfold, current falls tenfold — which is precisely the
          trade that makes long-distance transmission viable.
      - type: callout
        variant: warning
        title: Real transformers are not ideal
        text: >-
          Real units lose a little to resistance in the windings, to eddy currents in the core
          (reduced by laminating it), and to repeatedly remagnetising the core. Large grid
          transformers still manage better than 99% efficiency.
      - type: practice
        skill: physics-12-ac-transformers
      - type: summary
        points:
          - Transmission loss is I squared R, so it depends on current, not voltage
          - Raising the transmission voltage lowers the current and cuts losses as the square
          - The turns ratio sets the voltage ratio, and current changes inversely
          - Transformers need a changing field, which is why the grid uses alternating current

  - slug: lesson-physics-12-radiocarbon
    title: Dating the Past with a Decaying Nucleus
    topic: physics-12-decay-applications
    skill: physics-12-decay-law
    estimated_minutes: 24
    summary: Radioactive decay is completely random for one atom and perfectly predictable for a trillion.
    objectives:
      - Apply the exponential decay law N = N₀e^(−λt)
      - Relate the decay constant to half-life
      - Explain radiocarbon dating and the limits of the method
    attribution: Written for HieuTrienEducation. Decay treatment informed by OpenStax College Physics 2e (CC BY 4.0) and the PhET Radioactive Dating Game.
    license: proprietary
    blocks:
      - type: text
        markdown: |
          Take a single carbon-14 nucleus. When will it decay? There is no answer. Not "we do not
          know yet" — there is genuinely no fact about it. The nucleus does not age, does not
          become more likely to decay over time, and carries no internal clock.

          Now take a gram of carbon-14, containing some 10²² nuclei. Exactly 5,730 years from
          now, half of them will have decayed. You can bet a laboratory on it.

          Perfect randomness in the individual; perfect predictability in the aggregate.
      - type: text
        markdown: |
          ### The decay law

          Each nucleus has a fixed probability per second of decaying, called the decay constant
          λ. The number decaying in a short interval is therefore proportional to how many are
          left — which gives an exponential:

          $$N = N_0 e^{-\lambda t}$$

          Setting $N = N_0/2$ and solving gives the relationship to half-life:

          $$t_{1/2} = \frac{\ln 2}{\lambda}$$
      - type: interactive
        widget: function-plot
        config:
          functions:
            - {expression: "100*0.5**(x/5730)", label: "Carbon-14 remaining (%)", color: "primary"}
            - {expression: "50", label: "One half-life", color: "muted"}
          xRange: [0, 30000]
          yRange: [0, 100]
          axisLabels: {x: "years", y: "percentage remaining"}
      - type: callout
        variant: note
        title: The curve never reaches zero
        text: >-
          Each half-life removes half of what remains, not a fixed amount. After 10 half-lives
          about 0.1% is left; after 20, about one part in a million. This is why "how long until
          it is all gone" has no answer — but "how long until it is undetectable" does.
      - type: text
        markdown: |
          ### Dating something that was alive

          Cosmic rays continually produce carbon-14 in the upper atmosphere, keeping its
          proportion in atmospheric CO₂ roughly constant. A living plant exchanges carbon with
          the air, so it holds that same proportion. An animal eating the plant does too.

          At death the exchange stops. No new carbon-14 comes in, and what is there decays with
          a 5,730-year half-life. Measure how much is left relative to stable carbon-12, and the
          decay law gives the time since death.
      - type: example
        title: A piece of charcoal from a hearth
        steps:
          - text: "A sample has 25% of the carbon-14 of a living sample."
          - text: "25% is one half, then half again — two half-lives."
            math: "N/N_0 = 0.25 = \\left(\\tfrac{1}{2}\\right)^2"
          - text: "So the age is:"
            math: "t = 2 \\times 5730 = 11\\,460\\text{ years}"
          - text: "For a value that is not a neat power of a half, use the logarithm form: t = −ln(N/N₀)/λ."
      - type: table
        headers: ["Isotope", "Half-life", "Used to date"]
        rows:
          - ["Carbon-14", "5,730 years", "Once-living material, up to ~50,000 years"]
          - ["Uranium-238", "4.5 billion years", "Rocks, the age of the Earth"]
          - ["Potassium-40", "1.25 billion years", "Volcanic rock, hominid sites"]
          - ["Technetium-99m", "6 hours", "Medical imaging, not dating"]
      - type: callout
        variant: warning
        title: What radiocarbon cannot do
        text: >-
          It only works on material that was once alive — never on rock or metal. Beyond about
          ten half-lives (50,000 years) too little carbon-14 remains to measure reliably. And
          the atmospheric proportion has not been perfectly constant: nuclear weapons testing in
          the 1950s and fossil fuel burning both shifted it, so real dates are calibrated
          against tree rings rather than read straight off the equation.
      - type: practice
        skill: physics-12-decay-law
      - type: summary
        points:
          - Decay is random for a single nucleus and predictable for a large number
          - N = N₀e^(−λt), and the half-life is ln 2 divided by λ
          - Each half-life removes half of what remains, so the curve never reaches zero
          - Radiocarbon dating works on once-living material up to about 50,000 years
