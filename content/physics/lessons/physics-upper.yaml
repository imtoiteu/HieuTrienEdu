# Physics lessons for grades 10-12 — original content authored for HieuTrienEducation.
#
# Each lesson opens with a phenomenon the student has already met outside a classroom and works
# back to the physics, rather than presenting the equation first and appending an application.
# Facts drawn from open sources (OpenStax, NASA, PhET) are credited in the lesson's attribution;
# the prose is original.
lessons:
  # ------------------------------------------------------------------------------------
  # Grade 10
  # ------------------------------------------------------------------------------------
  - slug: lesson-physics-10-crumple-zones
    title: Why a Car Is Designed to Break
    topic: physics-10-impulse-collisions
    skill: physics-10-impulse
    estimated_minutes: 22
    summary: A modern car is built to destroy itself in a crash, and that is what saves you.
    objectives:
      - Relate impulse to the change in momentum of an object
      - Explain why extending a collision time reduces the force
      - Calculate the force on a passenger from a stopping time
    attribution: Written for HieuTrienEducation. Background on impulse and collisions informed by OpenStax University Physics Volume 1 (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          An old car from the 1960s was built like a tank. It came out of a low-speed crash
          barely dented — and the people inside were often badly hurt.

          A modern car crumples. The bonnet folds, the engine bay collapses, the whole front of
          the vehicle is destroyed. And the passengers walk away.

          This is not a decline in build quality. It is the single most important idea in
          vehicle safety, and it follows directly from one equation.
      - type: math
        latex: "F \\Delta t = \\Delta p = m \\Delta v"
      - type: callout
        variant: note
        title: What the equation is saying
        text: >-
          The left side is impulse: force multiplied by the time it acts for. The right side is
          the change in momentum. In a crash the right side is *fixed* — a passenger of a given
          mass is going to be brought from the car's speed to zero, and nothing changes that.
          So the only quantity a designer can control is the time.
      - type: text
        markdown: |
          ### The trade

          If Δp is fixed, then F and Δt trade off against each other. Stop in half the time and
          you double the force. Stretch the stop over four times as long and you quarter it.

          A rigid car stops in perhaps 20 milliseconds. A crumple zone folding progressively
          stretches that to 100 or 150 milliseconds. That is the difference between a survivable
          deceleration and a fatal one.
      - type: example
        title: The same crash, two cars
        steps:
          - text: "A 70 kg passenger is travelling at 20 m/s. The change in momentum is the same either way."
            math: "\\Delta p = 70 \\times 20 = 1400\\text{ kg m/s}"
          - text: "Rigid car — the stop takes 0.02 s."
            math: "F = \\frac{1400}{0.02} = 70\\,000\\text{ N}"
          - text: "With a crumple zone and an airbag — the stop takes 0.15 s."
            math: "F = \\frac{1400}{0.15} \\approx 9\\,300\\text{ N}"
          - text: "Same speed, same mass, same momentum. Roughly one seventh of the force."
      - type: table
        headers: ["Safety feature", "What it actually does", "Which quantity it changes"]
        rows:
          - ["Crumple zone", "Folds progressively instead of resisting", "Increases Δt"]
          - ["Airbag", "Lets the head decelerate over a longer distance", "Increases Δt"]
          - ["Seat belt", "Stretches slightly under load", "Increases Δt"]
          - ["Helmet padding", "Compresses during the impact", "Increases Δt"]
      - type: callout
        variant: tip
        title: The same idea, everywhere
        text: >-
          A gymnast bends their knees on landing. A cricketer draws their hands back while
          catching. A cardboard box protects a parcel. Every one of them is buying time to cut
          the force — the same equation, in a different setting.
      - type: callout
        variant: warning
        title: A common mistake
        text: >-
          Crumple zones do not "absorb the impact" in the sense of making the momentum
          disappear. Momentum is conserved. What they change is how long the transfer takes.
      - type: practice
        skill: physics-10-impulse
      - type: summary
        points:
          - Impulse F Δt equals the change in momentum m Δv
          - In a crash the change in momentum is fixed by mass and speed
          - Extending the collision time is the only way to reduce the force
          - Crumple zones, airbags, seat belts and padding all extend the time

  - slug: lesson-physics-10-terminal-velocity
    title: Why a Skydiver Stops Speeding Up
    topic: physics-10-friction-drag
    skill: physics-10-terminal-velocity
    estimated_minutes: 20
    summary: Falling objects do not accelerate forever — and the reason is a force that grows.
    objectives:
      - Describe how drag depends on speed
      - Explain terminal velocity as the balance of weight and drag
      - Read terminal velocity from a velocity-time graph
    attribution: Written for HieuTrienEducation. Skydiving figures informed by OpenStax College Physics 2e (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          Drop a stone from a tall building and it accelerates at about 10 m/s² the whole way
          down. Jump out of an aeroplane, and after about twelve seconds you stop speeding up
          entirely — you fall the remaining distance at a steady speed, around 55 m/s.

          Why does one keep accelerating and the other not?
      - type: text
        markdown: |
          ### Drag grows with speed

          The upward force from the air is **drag**, and unlike weight it is not constant. The
          faster you move, the more air you push out of the way each second, and the harder it
          pushes back. At the speeds involved here, roughly:

          $$F_{\text{drag}} \propto v^2$$

          Double your speed and the drag roughly quadruples.
      - type: callout
        variant: note
        title: The sequence
        text: >-
          At the instant you jump, v = 0, so drag = 0 and the only force is weight — you
          accelerate at the full 10 m/s². As v grows, drag grows, so the *resultant* force
          shrinks and the acceleration falls. Eventually drag equals weight, the resultant is
          zero, and the speed stops changing. That speed is the terminal velocity.
      - type: interactive
        widget: function-plot
        config:
          functions:
            - {expression: "55*(1 - 2.718281828**(-x/5))", label: "Skydiver — reaches terminal velocity", color: "primary"}
            - {expression: "10*x", label: "No air resistance — accelerates forever", color: "accent"}
          xRange: [0, 20]
          yRange: [0, 120]
          axisLabels: {x: "time (s)", y: "speed (m/s)"}
      - type: text
        markdown: |
          Notice the shape of the blue curve. It is steepest at the start, where drag is
          smallest, and flattens as the two forces approach balance. It never quite reaches a
          corner — it approaches the terminal velocity asymptotically.
      - type: example
        title: Finding a terminal velocity
        steps:
          - text: "A 80 kg skydiver has weight W = 80 × 10 = 800 N."
          - text: "At terminal velocity the drag exactly balances it."
            math: "F_{\\text{drag}} = 800\\text{ N}"
          - text: "If the drag is modelled as F = kv² with k = 0.25 kg/m, then:"
            math: "0.25 v^2 = 800 \\;\\Rightarrow\\; v = \\sqrt{3200} \\approx 57\\text{ m/s}"
      - type: table
        headers: ["Object", "Terminal velocity (approx.)", "Why"]
        rows:
          - ["Skydiver, belly-down", "55 m/s", "Large area, moderate mass"]
          - ["Skydiver, head-down", "90 m/s", "Same mass, much smaller area"]
          - ["Open parachute", "5 m/s", "Enormous area"]
          - ["Raindrop (2 mm)", "6 m/s", "Very small mass"]
          - ["Mist droplet", "0.01 m/s", "Tiny mass, relatively large drag"]
      - type: callout
        variant: tip
        title: Why a parachute works
        text: >-
          Opening a parachute does not add an upward force out of nowhere. It multiplies the
          area, so the *same* speed now produces far more drag than weight. The resultant force
          points upwards, you decelerate, and you settle at a new, much lower terminal velocity.
      - type: callout
        variant: warning
        title: Mist does not hurt
        text: >-
          If drag did not exist, a raindrop falling from 2 km would arrive at about 200 m/s.
          Rain would be lethal. Terminal velocity is the reason it merely gets you wet.
      - type: practice
        skill: physics-10-terminal-velocity
      - type: summary
        points:
          - Drag increases with speed, roughly as v squared
          - Acceleration falls as drag grows, because the resultant force shrinks
          - Terminal velocity is reached when drag equals weight
          - A larger area gives more drag and therefore a lower terminal velocity

  - slug: lesson-physics-10-projectiles
    title: A Thrown Ball Is Doing Two Things at Once
    topic: physics-10-projectile-motion
    skill: physics-10-projectile-components
    estimated_minutes: 22
    summary: The single idea that makes every projectile problem solvable — treat the directions separately.
    objectives:
      - Resolve a launch velocity into horizontal and vertical components
      - Explain why the two components are independent
      - Calculate time of flight and range for a projectile
    attribution: Written for HieuTrienEducation. Approach informed by OpenStax University Physics Volume 1 (CC BY 4.0) and the PhET Projectile Motion simulation.
    license: proprietary
    blocks:
      - type: text
        markdown: |
          Here is an experiment that surprises almost everyone the first time they see it.

          Take two identical balls. **Drop** one straight down. At exactly the same instant,
          **fire** the other horizontally at high speed. Which hits the ground first?

          They land together. Every time.
      - type: callout
        variant: note
        title: The key insight
        text: >-
          Gravity pulls downwards, so it changes only the *vertical* motion. It does not care
          what the object is doing horizontally. The two motions are completely independent —
          and that is what lets you solve them one at a time.
      - type: text
        markdown: |
          ### Resolving the launch

          A ball launched at speed $u$ and angle $\theta$ above the horizontal is really moving
          in two directions at once:

          $$u_x = u\cos\theta \qquad u_y = u\sin\theta$$

          From that moment on:

          - **Horizontally** there is no force (ignoring air resistance), so $u_x$ never changes.
          - **Vertically** gravity acts, so $u_y$ decreases, reaches zero at the top, and reverses.
      - type: table
        headers: ["", "Horizontal", "Vertical"]
        rows:
          - ["Initial velocity", "u cos θ", "u sin θ"]
          - ["Acceleration", "0", "−g (downwards)"]
          - ["Velocity later", "unchanged", "u sin θ − gt"]
          - ["At the highest point", "unchanged", "0"]
      - type: example
        title: A ball kicked at 20 m/s and 30°
        steps:
          - text: "Resolve the launch velocity."
            math: "u_x = 20\\cos 30° = 17.3\\text{ m/s},\\quad u_y = 20\\sin 30° = 10\\text{ m/s}"
          - text: "Time to the top: the vertical velocity falls from 10 m/s to 0 at 10 m/s² —"
            math: "t_{\\text{up}} = \\frac{10}{10} = 1.0\\text{ s}"
          - text: "Coming down takes just as long, so the total flight time is 2.0 s."
          - text: "The horizontal velocity never changed, so the range is:"
            math: "R = 17.3 \\times 2.0 = 34.6\\text{ m}"
      - type: callout
        variant: tip
        title: Why 45° goes furthest
        text: >-
          A shallow launch gives a large u_x but very little time in the air. A steep launch
          gives plenty of time but almost no horizontal speed. The range is the product of the
          two, and it peaks exactly in the middle, at 45°.
      - type: callout
        variant: warning
        title: Where this model stops working
        text: >-
          All of this assumes air resistance is negligible. For a football or a tennis ball it
          is not, and a real ball falls short of the predicted range and follows a slightly
          asymmetric path. The model is still the right place to start — but do not expect it
          to describe a golf drive precisely.
      - type: practice
        skill: physics-10-projectile-components
      - type: summary
        points:
          - Resolve the launch velocity into u cos θ horizontally and u sin θ vertically
          - The horizontal velocity is constant; only the vertical one changes
          - The two motions are independent and share only the time
          - Maximum range on level ground occurs at a launch angle of 45 degrees

