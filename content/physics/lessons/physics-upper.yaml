  - slug: lesson-physics-11-resonance
    title: The Bridge That Shook Itself Apart
    topic: physics-11-damping-resonance
    skill: physics-11-resonance
    estimated_minutes: 25
    summary: A moderate wind destroyed a steel suspension bridge. The wind was never the point.
    objectives:
      - Define the natural frequency of an oscillating system
      - Explain resonance in terms of energy added in phase with the motion
      - Identify resonance in engineering, music and medicine
    attribution: Written for HieuTrienEducation. Historical detail on the 1940 Tacoma Narrows collapse from public records; footage available on Wikimedia Commons.
    license: proprietary
    blocks:
      - type: text
        markdown: |
          On 7 November 1940, the Tacoma Narrows Bridge in Washington State began to twist. The
          wind was steady and moderate — around 19 m/s, well within what the bridge was built to
          withstand. It was not a storm.

          Over the next hour the twisting grew. And grew. The deck eventually rotated through
          nearly 45 degrees in each direction before the structure tore itself apart and fell
          into the water.

          The wind never got stronger. So where did the energy come from?
      - type: callout
        variant: note
        title: Natural frequency
        text: >-
          Every object that can oscillate has a frequency it "prefers" — the rate it vibrates
          at when disturbed and left alone. A guitar string, a wine glass, a pendulum, a steel
          bridge deck: each has its own natural frequency, set by its stiffness and its mass.
      - type: text
        markdown: |
          ### Pushing in time

          Think about pushing a child on a swing. The swing has a natural frequency. If you push
          at random moments, half your pushes help and half fight the motion, and nothing much
          happens. But if you time each push to arrive exactly as the swing moves away from you,
          every push adds energy.

          You are not pushing harder. You are pushing **in phase**. And the amplitude grows and
          grows.

          That is resonance, and it is what happened to the bridge: the wind shed vortices off
          the deck at a rate that happened to match one of the deck's natural twisting
          frequencies. Each cycle added a little more energy, in time with the motion.
      - type: interactive
        widget: function-plot
        config:
          functions:
            - {expression: "1/((1 - x*x)*(1 - x*x) + 0.02*x*x)", label: "Light damping — huge peak", color: "primary"}
            - {expression: "1/((1 - x*x)*(1 - x*x) + 0.4*x*x)", label: "Heavy damping — flattened", color: "accent"}
          xRange: [0, 2.5]
          yRange: [0, 20]
          axisLabels: {x: "driving frequency ÷ natural frequency", y: "amplitude"}
      - type: text
        markdown: |
          The peak sits where the driving frequency equals the natural frequency — the ratio of
          1 on the horizontal axis. Notice what damping does: it does not move the peak much,
          but it dramatically limits how tall it gets.

          The Tacoma Narrows deck was a solid plate girder. It was stiff, light, and had very
          little damping. That combination is exactly the blue curve.
      - type: table
        headers: ["Where resonance appears", "Driver", "Result"]
        rows:
          - ["Swing", "Pushes timed to the motion", "Large amplitude from small pushes"]
          - ["Guitar body", "Vibrating string", "The sound you actually hear"]
          - ["Microwave oven", "2.45 GHz radiation", "Water molecules absorb energy, food heats"]
          - ["MRI scanner", "Radio pulse at the Larmor frequency", "Hydrogen nuclei respond, giving an image"]
          - ["Building in an earthquake", "Ground motion", "Collapse, if the frequencies match"]
      - type: callout
        variant: tip
        title: How engineers respond
        text: >-
          There are only two defences, and both are used. **Shift the natural frequency** away
          from anything likely to drive it — the replacement bridge used an open truss deck that
          lets wind through. Or **add damping**, so energy leaves as fast as it arrives: modern
          tall buildings hang enormous tuned mass dampers near the top for exactly this reason.
      - type: callout
        variant: warning
        title: Not the same as a strong force
        text: >-
          The point of the Tacoma Narrows story is that a small periodic force at the right
          frequency can do what a much larger steady force cannot. Resonance is about timing,
          not magnitude.
      - type: practice
        skill: physics-11-resonance
      - type: summary
        points:
          - Every oscillating system has a natural frequency
          - Resonance occurs when a driving force matches that frequency
          - Energy added in phase accumulates, so the amplitude grows far beyond the driving force
          - Damping limits the peak; changing the natural frequency avoids it entirely

  - slug: lesson-physics-11-noise-cancelling
    title: Making Silence out of Two Sounds
    topic: physics-11-wave-properties
    skill: physics-11-superposition
    estimated_minutes: 22
    summary: Noise-cancelling headphones do not block sound. They add more of it.
    objectives:
      - Apply the principle of superposition to two overlapping waves
      - Relate path difference to constructive and destructive interference
      - Explain how active noise cancellation works and where it fails
    attribution: Written for HieuTrienEducation. Wave behaviour informed by OpenStax University Physics Volume 1 (CC BY 4.0) and the PhET Wave Interference simulation.
    license: proprietary
    blocks:
      - type: text
        markdown: |
          Put on a pair of noise-cancelling headphones on a plane and the engine roar drops
          away. It feels like the headphones are blocking the sound.

          They are not. There is a microphone on the outside, and the headphones are *playing a
          sound of their own* — one carefully shaped so that it cancels the noise. They make
          silence by adding sound to sound.
      - type: callout
        variant: note
        title: The principle of superposition
        text: >-
          Where two waves overlap, the resultant displacement at each point is simply the sum
          of the individual displacements. Waves pass through each other and continue
          unchanged; they only add where they meet.
      - type: text
        markdown: |
          ### Two extremes

          Because the displacements add, the result depends entirely on the **phase**
          relationship:

          - **In phase** — crests land on crests. The displacements add to a larger amplitude.
            This is *constructive* interference.
          - **In antiphase** — crests land on troughs. Equal and opposite displacements sum to
            zero. This is *destructive* interference.
      - type: math
        latex: "\\text{path difference} = n\\lambda \\;(\\text{constructive}) \\qquad \\text{path difference} = \\left(n + \\tfrac{1}{2}\\right)\\lambda \\;(\\text{destructive})"
      - type: example
        title: Two speakers in a room
        steps:
          - text: "Two speakers emit the same 340 Hz note in phase. Sound travels at 340 m/s, so λ = 1.0 m."
          - text: "At a point 3.0 m from one speaker and 4.0 m from the other, the path difference is 1.0 m."
            math: "\\Delta = 1.0\\text{ m} = 1\\lambda"
          - text: "A whole number of wavelengths — constructive. The note is loud here."
          - text: "Move to where the path difference is 1.5 m and it becomes 1.5λ — destructive. The note nearly vanishes."
      - type: callout
        variant: tip
        title: You can walk through this
        text: >-
          With two speakers playing the same pure tone in a room, walking slowly across the room
          takes you through alternating loud and quiet bands. The sound has not changed. Your
          position relative to the two paths has.
      - type: text
        markdown: |
          ### Back to the headphones

          Active noise cancellation does the same thing deliberately. The external microphone
          samples the incoming noise; the electronics invert it — shifting it by half a cycle —
          and the speaker plays the inverted version. Noise plus inverted noise sums to close
          to zero at your eardrum.
      - type: table
        headers: ["Sound", "How well it cancels", "Why"]
        rows:
          - ["Aircraft engine hum", "Very well", "Low frequency, steady, predictable"]
          - ["Air conditioning", "Very well", "Continuous and unchanging"]
          - ["Speech", "Poorly", "Changes far too fast to predict"]
          - ["Sudden clatter", "Barely at all", "Over before the inverse can be generated"]
      - type: callout
        variant: warning
        title: Why the high notes survive
        text: >-
          Cancellation needs the inverted wave to arrive within a small fraction of a period. At
          100 Hz a period is 10 ms — plenty of time. At 5 kHz it is 0.2 ms, and any processing
          delay wrecks the alignment. This is exactly why these headphones kill engine drone but
          not a crying baby.
      - type: practice
        skill: physics-11-superposition
      - type: summary
        points:
          - Superposition means overlapping displacements simply add
          - A path difference of a whole number of wavelengths gives constructive interference
          - A path difference of a half-odd number of wavelengths gives destructive interference
          - Active noise cancellation generates an inverted wave, and works best at low frequencies

  - slug: lesson-physics-11-touchscreen
    title: How a Screen Knows You Touched It
    topic: physics-11-potential-capacitance
    skill: physics-11-capacitance
    estimated_minutes: 20
    summary: Your phone screen has no buttons and no pressure sensor. It measures capacitance.
    objectives:
      - Apply Q = CV and calculate stored energy
      - Explain what changes a capacitance
      - Describe how a capacitive touchscreen detects a finger
    attribution: Written for HieuTrienEducation. Capacitance treatment informed by OpenStax University Physics Volume 2 (CC BY 4.0).
    license: proprietary
    blocks:
      - type: text
        markdown: |
          Try using your phone with gloves on and nothing happens. Tap it with a pencil and
          nothing happens either. But touch it with a bare finger — no pressure needed, barely a
          brush — and it responds immediately.

          The screen is not detecting force. It is detecting *you*.
      - type: text
        markdown: |
          ### What a capacitor is

          A capacitor is two conductors separated by an insulator. Connect it to a voltage and
          charge builds on the plates:

          $$Q = CV$$

          The capacitance $C$ measures how much charge the arrangement holds per volt. It
          depends only on the geometry and on what sits between the plates — not on the voltage
          you apply.
      - type: callout
        variant: note
        title: What changes a capacitance
        text: >-
          Bigger overlapping area gives more capacitance. A smaller gap gives more capacitance.
          And putting a material with a high permittivity in the gap gives more capacitance —
          which is the part that matters here.
      - type: text
        markdown: |
          ### The screen

          Underneath the glass is a grid of transparent electrodes, forming a small capacitor at
          every intersection. The phone continuously measures the capacitance at each one.

          The human body is largely water, and water has an unusually high permittivity. Bring a
          finger near an intersection and you change the electric field there — the capacitance
          at that point shifts by a few percent. The controller reads which intersections
          changed and where the peak is, and reports a touch position.

          A gloved finger is separated by an insulator and barely registers. A wooden pencil is
          not conductive and does not disturb the field. A stylus made for touchscreens has a
          conductive tip connected to your hand, which is why *it* works.
      - type: example
        title: Energy in a camera flash capacitor
        steps:
          - text: "A 220 μF capacitor is charged to 300 V."
          - text: "Charge stored:"
            math: "Q = CV = 220\\times10^{-6} \\times 300 = 0.066\\text{ C}"
          - text: "Energy stored:"
            math: "E = \\tfrac{1}{2}CV^2 = 0.5 \\times 220\\times10^{-6} \\times 300^2 = 9.9\\text{ J}"
          - text: "Released in about 1 ms, that is roughly 10 kW of instantaneous power — from a capacitor charged by a small battery."
      - type: table
        headers: ["Capacitor use", "Typical value", "What it exploits"]
        rows:
          - ["Touchscreen intersection", "~1 pF", "Change in permittivity near a finger"]
          - ["Camera flash", "100–500 μF", "Slow charge, very fast discharge"]
          - ["Power supply smoothing", "1000+ μF", "Stores charge between mains cycles"]
          - ["Radio tuning", "variable, ~pF", "Changing C changes the resonant frequency"]
      - type: callout
        variant: warning
        title: Charged capacitors stay dangerous
        text: >-
          A capacitor holds its energy after the power is disconnected. The flash capacitor in a
          disposable camera can deliver a serious shock days later. Never open one.
      - type: practice
        skill: physics-11-capacitance
      - type: summary
        points:
          - Capacitance is charge stored per volt, Q = CV
          - Energy stored is half C V squared
          - Capacitance depends on area, separation and the material between the plates
          - A touchscreen detects the change in capacitance a finger causes, not pressure

